function fieldAddRow(kind){
  const colorable=['projects','priorities','statuses','labels'].includes(kind);
  return`<div class="field-add"><input type="text" id="field-new-name" placeholder="Novo item...">${colorable?'<input type="color" id="field-new-color" value="#378ADD" style="width:46px;height:32px;border:1px solid var(--brd2);border-radius:var(--r);padding:2px;background:var(--surf)">':''}<button class="btn-p" onclick="fmAdd('${kind}')">Criar</button></div>`;
}
function fmRename(kind,key,val){
  val=val.trim();if(!val)return;snapshot();
  if(kind==='clients'){const old=globalClients[+key];globalClients[+key]=val;tasks.forEach(t=>{if(t.client===old)t.client=val;});notes.forEach(n=>{if(n.client===old)n.client=val;});}
  if(kind==='projects'){const old=PROJECTS[+key];PROJECTS[+key]=val;PC[val]=PC[old]||'#888780';delete PC[old];tasks.forEach(t=>{if(t.project===old)t.project=val;});notes.forEach(n=>{if(n.project===old)n.project=val;});studies.forEach(s=>{if(s.project===old)s.project=val;});}
  if(kind==='types'){const o=typeOptions.find(x=>x.id===key);if(o)o.name=val;}
  if(kind==='priorities'){const o=priorityOptions.find(x=>x.id===key);if(o)o.name=val;}
  if(kind==='statuses'){const o=columns.find(x=>x.id===key);if(o)o.name=val;}
  if(kind==='labels'){const o=globalLabels.find(x=>x.id===key);if(o)o.name=val;}
  fieldSave();renderFieldManager();
}
function fmColor(kind,key,val){
  snapshot();
  if(kind==='projects')PC[PROJECTS[+key]]=val;
  if(kind==='priorities'){const o=priorityOptions.find(x=>x.id===key);if(o)o.color=val;}
  if(kind==='statuses'){const o=columns.find(x=>x.id===key);if(o)o.color=val;}
  if(kind==='labels'){const o=globalLabels.find(x=>x.id===key);if(o)o.color=val;}
  fieldSave();renderFieldManager();
}
function fmAdd(kind){
  const inp=document.getElementById('field-new-name'),ci=document.getElementById('field-new-color');const name=inp?.value.trim();if(!name)return;snapshot();const color=ci?.value||'#378ADD';
  if(kind==='clients'&&!globalClients.includes(name))globalClients.push(name);
  if(kind==='projects'&&!PROJECTS.includes(name)){PROJECTS.push(name);PC[name]=color;}
  if(kind==='types')typeOptions.push({id:'type_'+Date.now(),name});
  if(kind==='priorities')priorityOptions.push({id:'prio_'+Date.now(),name,color});
  if(kind==='statuses')columns.push({id:'col_'+Date.now(),name,color});
  if(kind==='labels')globalLabels.push({id:'lbl_'+Date.now(),name,color});
  fieldSave();renderFieldManager();
}
function fmDelete(kind,key){
  if(!confirm('Excluir este item? As tarefas associadas serão ajustadas.'))return;snapshot();
  if(kind==='clients'){const old=globalClients[+key];globalClients.splice(+key,1);tasks.forEach(t=>{if(t.client===old)t.client='';});notes.forEach(n=>{if(n.client===old)n.client='';});}
  if(kind==='projects'){const old=PROJECTS[+key];PROJECTS.splice(+key,1);delete PC[old];tasks.forEach(t=>{if(t.project===old)t.project='';});notes.forEach(n=>{if(n.project===old)n.project='';});studies.forEach(s=>{if(s.project===old)s.project='';});}
  if(kind==='types'){if(typeOptions.length<=1)return showToast('Mantenha pelo menos um tipo');typeOptions=typeOptions.filter(x=>x.id!==key);tasks.forEach(t=>{if(t.type===key)t.type=typeOptions[0].id;});}
  if(kind==='priorities'){if(priorityOptions.length<=1)return showToast('Mantenha pelo menos uma prioridade');priorityOptions=priorityOptions.filter(x=>x.id!==key);tasks.forEach(t=>{if(t.priority===key)t.priority=priorityOptions[0].id;});studies.forEach(s=>{if(s.priority===key)s.priority=priorityOptions[0].id;});}
  if(kind==='statuses'){if(columns.length<=1)return showToast('Mantenha pelo menos um status');columns=columns.filter(x=>x.id!==key);tasks.forEach(t=>{if(t.status===key)t.status=columns[0].id;});}
  if(kind==='labels'){globalLabels=globalLabels.filter(x=>x.id!==key);tasks.forEach(t=>{t.labels=(t.labels||[]).filter(id=>id!==key);});notes.forEach(n=>{n.labels=(n.labels||[]).filter(id=>id!==key);});}
  fieldSave();renderFieldManager();
}

function hideTO(){const dd=document.getElementById('tdrop');if(dd)dd.style.display='none';}

function rteExec(cmd,val){
  const rte=document.getElementById('rte')||document.getElementById('note-rte');if(rte)rte.focus();
  document.execCommand(cmd,false,val||null);
  if(cmd==='insertUnorderedList'||cmd==='insertOrderedList'){
    document.querySelectorAll('#rte ul,#rte ol,#note-rte ul,#note-rte ol').forEach(el=>{el.style.marginLeft='24px';el.style.paddingLeft='12px';});
  }
}
function normalizeRteLinks(root){
  const urlRe=/https?:\/\/[^\s<>"']+/g;
  const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('a')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);
  nodes.forEach(n=>{
    const txt=n.nodeValue;if(!urlRe.test(txt))return;urlRe.lastIndex=0;
    const frag=document.createDocumentFragment();let last=0,m;
    while((m=urlRe.exec(txt))){frag.append(document.createTextNode(txt.slice(last,m.index)));const a=document.createElement('a');a.href=m[0];a.target='_blank';a.rel='noopener';a.textContent=m[0];frag.append(a);last=m.index+m[0].length;}
    frag.append(document.createTextNode(txt.slice(last)));n.parentNode.replaceChild(frag,n);
  });
}
function handleRteLinkClick(e){
  const a=e.target.closest('a');
  if(!a)return;
  e.preventDefault();
  e.stopPropagation();
  window.open(a.href,'_blank','noopener');
}
function linkifyPlainText(txt){
  return esc(txt).replace(/https?:\/\/[^\s<>"']+/g,u=>`<a href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${u}</a>`).replace(/\n/g,'<br>');
}
function rteSz(s){if(!s)return;document.execCommand('fontSize',false,4);const sel=window.getSelection();if(sel.rangeCount){const fonts=document.querySelectorAll('font[size="4"]');fonts.forEach(el=>{el.removeAttribute('size');el.style.fontSize=s+'px';});}}

function buildForm(t){
  const isNew=!t;
  const sO=columns.map(c=>`<option value="${c.id}"${!isNew&&t.status===c.id?' selected':''}>${c.name}</option>`).join('');
  const pO=priorityOptions.map(o=>`<option value="${o.id}"${!isNew&&t.priority===o.id?' selected':''}>${esc(o.name)}</option>`).join('');
  const tO=typeOptions.map(o=>`<option value="${o.id}"${!isNew&&t.type===o.id?' selected':''}>${esc(o.name)}</option>`).join('');
  const defaultProject=isNew&&fProj!=='all'&&PROJECTS.includes(fProj)?fProj:'';
  const projO=['<option value="">Sem projeto</option>',...PROJECTS.map(p=>`<option value="${p}"${(!isNew&&t.project===p)||(isNew&&defaultProject===p)?' selected':''}>${p}</option>`)].join('');
  const det=isNew?'<p><br></p>':(t.details||'').startsWith('<')?t.details:`<p>${t.details||''}</p>`;
  let ttHtml='';
  if(!isNew){
    const isR=activeId===t.id;
    const sessHtml=t.sessions&&t.sessions.length?`<div class="tt-sessions">${[...t.sessions].reverse().slice(0,5).map((s,ri)=>{const oi=t.sessions.length-1-ri;return`<div class="tt-sess"><span>${new Date(s.start).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})} ${new Date(s.start).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span><span class="tt-sdur">${fmt(s.dur)}</span><span class="tt-sess-actions"><span class="tt-sedit" onclick="openSessionEditor(${t.id},${oi})" title="Editar sessão">&#9998;</span><span class="tt-sdel" onclick="delSess(${t.id},${oi})">&#10005;</span></span></div>`;}).join('')}</div>`:'<div style="font-size:11px;color:var(--tx3)">Nenhuma sessão ainda.</div>';
    const pomoRem=pomoOn&&pomoTid===t.id?Math.max(0,Math.ceil((pomoEnd-Date.now())/1000)):0;
    ttHtml=`<div class="ff"><label class="fl">&#128336; Controle de Tempo</label>
      <div class="tt-box">
        <div class="tt-hdr"><span class="tt-lbl">Tempo acumulado</span><span class="tt-total">${hms(t.totalTime||0)}</span></div>
        ${sessHtml}
        <div class="tt-acts">
          <button class="tt-pbtn${isR?' stop':' go'}" onclick="${isR?'stopTracking();closeModal()':'startTracking('+t.id+');closeModal()'}">
            ${isR?'&#9646;&#9646; Pausar':'&#9654; Iniciar'}
          </button>
          ${(t.totalTime||0)>0?`<button class="btn-c" style="font-size:11px;padding:5px 9px" onclick="rstTime(${t.id})">&#8635;</button>`:''}
        </div>
        <div style="border-top:1px solid var(--brd);padding-top:8px">
          <div style="font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between">
            Pomodoro
            <button onclick="pomoMuted=!pomoMuted;this.textContent=pomoMuted?'&#128263; Som desativado':'&#128266; Som ativado'" style="font-size:10px;background:transparent;border:1px solid var(--brd2);border-radius:20px;padding:2px 7px;cursor:pointer;color:var(--tx3)">${pomoMuted?'&#128263; Som desativado':'&#128266; Som ativado'}</button>
          </div>
          <div class="pomo-row">
            ${pomoOn&&pomoTid===t.id?`<span class="pomo-clock">${hms(pomoRem)}</span>`:''}
            <button class="pomo-btn${pomoOn&&pomoTid===t.id?' run':''}" onclick="startPomo(${t.id},5,'Pomodoro 5m');closeModal()">&#9654; 5 min</button>
            <button class="pomo-btn${pomoOn&&pomoTid===t.id?' run':''}" onclick="startPomo(${t.id},10,'Pomodoro 10m');closeModal()">&#9654; 10 min</button>
            <button class="pomo-btn${pomoOn&&pomoTid===t.id?' run':''}" onclick="startPomo(${t.id},25,'Pomodoro 25m');closeModal()">&#9654; 25 min + pausa</button>
          </div>
        </div>
      </div>
    </div>`;
  }
  return`
    <div class="ff"><label class="fl">Título</label><input type="text" id="f-title" value="${isNew?'':esc(t.title)}" placeholder="Nome da tarefa..."></div>
    <div class="ff"><label class="fl">Detalhes</label>
      <div class="rte-wrap">${rteToolbar()}<div class="rte-body" id="rte" contenteditable="true" onclick="handleRteLinkClick(event)" oninput="clearTimeout(this._linkTimer);this._linkTimer=setTimeout(()=>normalizeRteLinks(this),500)" onpaste="setTimeout(()=>normalizeRteLinks(this),50)">${det}</div></div>

      <div class="ff"><label class="fl">Tipo</label><select id="f-type">${tO}</select></div>

      <div class="ff"><label class="fl">Status</label><select id="f-status">${sO}</select></div>
    </div>
    <div class="fr3">
      <div class="ff"><label class="fl">Projeto</label><select id="f-proj">${projO}</select></div>
      <div class="ff"><label class="fl">Cliente</label>${buildDD('client',isNew?[]:(t.client?[t.client]:[]),globalClients.map(c=>({id:c,name:c,color:'#378ADD'})),'','Selecionar cliente...',true,'Novo cliente...')}</div>
      <div class="ff"><label class="fl">Data</label><input type="date" id="f-date" value="${isNew?'':t.date}"></div>
    </div>
    <div class="fr-time-label">
      <div class="ff"><label class="fl">Horário</label>${timeField(isNew?'':t.time)}</div>
      <div class="ff"><label class="fl">Marcadores</label>${buildDD('labels',isNew?[]:t.labels,globalLabels,lb=>lb.color,'Selecionar marcadores...',true,'Novo marcador...')}</div>

      <div class="sub-list" id="sub-list"></div>
      <div class="add-row"><input type="text" id="sub-inp" placeholder="Adicionar subtarefa..."><button class="btn-p" onclick="addSub()" style="padding:7px 11px">&#43;</button></div>
    </div>`;
}

function buildHist(t){
  const hist=t?[...(t.history||[])].reverse():[];
  return`<div class="mo-side">
    <div class="mo-side-hdr">&#128172; Histórico</div>
    <div class="hist-list" id="hist-list">
      ${hist.length?hist.map(h=>`<div class="hist-item"><div class="hist-text">${linkifyPlainText(h.text)}</div><div class="hist-time">${h.time}</div></div>`).join(''):'<div style="font-size:12px;color:var(--tx3);text-align:center;padding:16px">Sem histórico ainda.</div>'}
    </div>
    <div class="hist-inp-wrap">
      <textarea class="hist-inp" id="hist-inp" placeholder="Registrar atualização..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendHist(${t?t.id:-1})}"></textarea>
      <button class="hist-send" onclick="sendHist(${t?t.id:-1})">&#10148;</button>
    </div>
  </div>`;
}
function sendHist(tid){
  const inp=document.getElementById('hist-inp');if(!inp)return;
  const text=inp.value.trim();if(!text)return;
  const t=tasks.find(x=>x.id===tid);if(!t)return;
  t.history=t.history||[];
  const now=new Date();
  t.history.push({text,time:now.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
  inp.value='';save('hw_tasks',tasks);
  const list=document.getElementById('hist-list');
  if(list)list.innerHTML=[...t.history].reverse().map(h=>`<div class="hist-item"><div class="hist-text">${linkifyPlainText(h.text)}</div><div class="hist-time">${h.time}</div></div>`).join('');
}

function openNew(date,status){
  window._sub=[];window._editLabels=[];window._editClient=[];
  document.getElementById('modal').innerHTML=`<div class="mbk" data-mode="new" onclick="closeMB(event)"><div class="mo" onclick="event.stopPropagation()">
    <div class="mo-main">
      <div class="mo-hdr"><span class="mo-title">Nova tarefa</span><button class="ib" style="margin-left:auto" onclick="closeModalNoSave()">&#10005;</button></div>
      <div class="mo-body">${buildForm(null)}</div>
      <div class="mo-foot"><button class="btn-c" onclick="closeModalNoSave()">Cancelar</button><button class="btn-p" onclick="saveNew()">Criar tarefa</button></div>
    </div>
  </div></div>`;
  if(date)setTimeout(()=>{const e=document.getElementById('f-date');if(e)e.value=date;},10);
  if(status)setTimeout(()=>{const e=document.getElementById('f-status');if(e)e.value=status;},10);
  setTimeout(()=>{const e=document.getElementById('f-title');if(e)e.focus();bindSE();},10);
  renderSubs();
}
function openTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  window._sub=[...t.subtasks];window._editLabels=[...t.labels];window._editClient=t.client?[t.client]:[];
  document.getElementById('modal').innerHTML=`<div class="mbk" data-mode="edit" data-id="${id}" onclick="closeMB(event)"><div class="mo" onclick="event.stopPropagation()" style="max-width:980px">
    <div class="mo-inner">
      <div class="mo-main">
        <div class="mo-hdr">
          <span class="mo-title">Editar tarefa</span>
          <button class="ib" onclick="openFieldManager(${t.id})" title="Editar campos personalizados" style="margin-left:auto">&#9881;</button>
          <button class="ib" onclick="dupTask(${t.id})" title="Duplicar">&#10065;</button>
          <button class="ib" onclick="closeModalNoSave()">&#10005;</button>
        </div>
        <div class="mo-body">${buildForm(t)}</div>
        <div class="mo-foot">
          <button class="btn-c" onclick="delTask(${t.id})" style="color:var(--err-tx);margin-right:auto">&#128465; Excluir</button>
          ${shouldOfferMeeting02(t)?`<button class="btn-c" onclick="openMeetingTemplateModal('meeting-02',${t.id})">&#128197; Criar Reunião 02</button>`:''}
          <button class="btn-c" onclick="closeModalNoSave()">Cancelar</button>
          <button class="btn-p" onclick="saveEdit(${t.id})">Salvar</button>
        </div>
      </div>
      ${buildHist(t)}
    </div>
  </div></div>`;
  setTimeout(bindSE,10);renderSubs();
}
function bindSE(){const si=document.getElementById('sub-inp');if(si)si.addEventListener('keydown',e=>{if(e.key==='Enter')addSub();});}
function addSub(){const i=document.getElementById('sub-inp');const v=i&&i.value.trim();if(!v)return;window._sub=window._sub||[];window._sub.push({id:Date.now(),text:v,done:false});i.value='';renderSubs();}
function rmSub(id){window._sub=(window._sub||[]).filter(s=>s.id!==id);renderSubs();}
function tglSub(id){const s=(window._sub||[]).find(x=>x.id===id);if(s)s.done=!s.done;renderSubs();}
function renderSubs(){
  const el=document.getElementById('sub-list');if(!el)return;
  el.innerHTML=(window._sub||[]).map(s=>`<div class="sub-item">
    <input type="checkbox"${s.done?' checked':''} onchange="tglSub(${s.id})" style="width:14px;height:14px;cursor:pointer">
    <span class="sub-text" style="${s.done?'text-decoration:line-through;color:var(--tx3)':''}">${esc(s.text)}</span>
    <span onclick="rmSub(${s.id})" style="cursor:pointer;color:var(--tx3);font-size:12px">&#10005;</span>
  </div>`).join('');
}
function getVals(){
  const rte=document.getElementById('rte');
  if(rte)normalizeRteLinks(rte);
  const cli=window._editClient&&window._editClient[0]||'';
  return{
    title:(document.getElementById('f-title')?.value||'').trim(),
    type:document.getElementById('f-type')?.value||'task',
    status:document.getElementById('f-status')?.value||'todo',
    priority:document.getElementById('f-prio')?.value||'med',
    project:document.getElementById('f-proj')?.value||'',
    client:cli,
    date:document.getElementById('f-date')?.value||'',
    time:document.getElementById('f-time')?.value||'',
    details:rte?rte.innerHTML:'',
    subtasks:[...(window._sub||[])],
    labels:[...(window._editLabels||[])],
  };
}
function saveNew(){const v=getVals();if(!v.title)return;snapshot();tasks.push({id:nextId++,...v,totalTime:0,sessions:[],history:[]});window._sub=[];closeModal();}
function saveEdit(id){snapshot();const t=tasks.find(x=>x.id===id);if(!t)return;const v=getVals();if(!v.title)return;const hist=t.history||[];Object.assign(t,v);t.history=hist;window._sub=[];closeModal();}
function dupTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  snapshot();
  tasks.push({...JSON.parse(JSON.stringify(t)),id:nextId++,title:t.title+' (cópia)',totalTime:0,sessions:[],history:[]});
  persist();if(document.getElementById('modal').innerHTML)closeModal();
  showToast('Tarefa duplicada');
}
function delSess(tid,idx){const t=tasks.find(x=>x.id===tid);if(!t)return;snapshot();const s=t.sessions[idx];if(s){t.totalTime=Math.max(0,(t.totalTime||0)-s.dur);t.sessions.splice(idx,1);}save('hw_tasks',tasks);openTask(tid);}
function rstTime(tid){const t=tasks.find(x=>x.id===tid);if(!t)return;snapshot();if(activeId===tid)stopTracking();t.totalTime=0;t.sessions=[];save('hw_tasks',tasks);openTask(tid);}
function tglDone(id){snapshot();const t=tasks.find(x=>x.id===id);if(t)t.status=t.status==='done'?'todo':'done';persist();}
function delTask(id){snapshot();if(activeId===id)stopTracking();tasks=tasks.filter(t=>t.id!==id);persist();closeModal();}

function typeIdByName(v){
  const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const found=typeOptions.find(o=>o.id===v||norm(o.name)===norm(v));
  return found?found.id:(v||'task');
}
function prioIdByName(v){
  const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const found=priorityOptions.find(o=>o.id===v||norm(o.name)===norm(v));
  return found?found.id:(v||'med');
}
function parseLooseDate(v){
  v=String(v||'').trim();if(!v)return'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
  const m=v.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(!m)return'';
  const y=m[3]?Number(m[3].length===2?'20'+m[3]:m[3]):todayCal.getFullYear();
  return`${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
}

function saveBulkImport(){
  const raw=document.getElementById('bulk-lines')?.value||'';
  const def={project:document.getElementById('bulk-proj')?.value||'',type:document.getElementById('bulk-type')?.value||'task',priority:document.getElementById('bulk-prio')?.value||'med',status:document.getElementById('bulk-status')?.value||'todo',date:document.getElementById('bulk-default-date')?.value||''};
  const lines=raw.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return showToast('Cole pelo menos uma linha');
  snapshot();let added=0;
  lines.forEach(line=>{
    let parts=line.split(/\t|;/).map(p=>p.trim());
    let date=parseLooseDate(parts[0]);if(date)parts.shift();else date=def.date;
    let time=/^\d{1,2}:\d{2}$/.test(parts[0]||'')?parts.shift():'';
    const title=parts.shift();if(!title)return;
    const project=parts.shift()||def.project;
    const type=typeIdByName(parts.shift()||def.type);
    const priority=prioIdByName(parts.shift()||def.priority);
    const details=parts.length?`<p>${esc(parts.join(' - '))}</p>`:'';
    tasks.push({id:nextId++,title,type,status:def.status,priority,date,time,details,subtasks:[],totalTime:0,sessions:[],project,client:'',labels:[],history:[]});
    added++;
  });
  closeModal();showToast(`${added} item(ns) criado(s)`);
}

function routineFreqLabel(f){return{daily:'Diária',weekdays:'Dias úteis',weekly:'Semanal',monthly:'Mensal'}[f]||'Livre';}
function routineScheduleLabel(r){const ds=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];return r.weekday!==''&&r.weekday!==undefined?`${routineFreqLabel(r.frequency)} - ${ds[Number(r.weekday)]}`:routineFreqLabel(r.frequency);}
function nextRoutineDate(r){
  let d=todayStr;
  if(r.weekday!==''&&r.weekday!==undefined){
    const target=Number(r.weekday),x=dateFromISO(d);
    let diff=(target-x.getDay()+7)%7;
    x.setDate(x.getDate()+diff);
    return toISO(x);
  }
  if(r.frequency==='weekdays'){let x=dateFromISO(d);while([0,6].includes(x.getDay())){x.setDate(x.getDate()+1);d=toISO(x);}}
  return d;
}

function updateCloudBar(msg,type=''){
  const st=document.getElementById('cloud-status'),login=document.getElementById('cloud-login-btn'),svb=document.getElementById('cloud-save-btn'),ldb=document.getElementById('cloud-load-btn');
  if(!st)return;
  st.className='cloud-pill'+(type==='ok'?' on':type==='err'?' err':'');
  st.innerHTML=`<span class="cloud-dot"></span> ${msg||cloudStatusText()}`;
  if(login)login.textContent=cloudUser?'Sair':'Entrar';
  if(login)login.onclick=cloudUser?cloudSignOut:openCloudLogin;
  if(svb)svb.style.display=cloudUser?'inline-flex':'none';
  if(ldb)ldb.style.display=cloudUser?'inline-flex':'none';
}
function cloudStatusText(){
  if(!window.supabase)return'Nuvem indisponível';
  if(!cloudUser)return'Nuvem desligada';
  return cloudLastSync?`Nuvem ok ${cloudLastSync}`:'Nuvem conectada';
}
async function getCloudSessionUser(){
  if(!sbClient)return null;
  const {data,error}=await sbClient.auth.getSession();
  if(error)throw error;
  cloudUser=data?.session?.user||null;
  return cloudUser;
}
async function initCloud(){
  if(!window.supabase){updateCloudBar('Nuvem indisponível','err');return;}
  sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  await getCloudSessionUser();
  sbClient.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;updateCloudBar();render();});
  cloudReady=true;updateCloudBar();
  if(cloudUser)await cloudLoadNow(false);
  else render();
}
function scheduleCloudSave(){
  if(cloudApplying||!cloudReady||!cloudUser||!sbClient)return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(()=>cloudSaveNow(true),1200);
}
async function cloudSaveNow(silent=false){
  if(!cloudUser||!sbClient){if(!silent)openCloudLogin();return;}
  try{
    const sessionUser=await getCloudSessionUser();
    if(!sessionUser){
      updateCloudBar('Entre na nuvem','err');
      if(!silent)openCloudLogin();
      return;
    }
    updateCloudBar('Salvando nuvem...');
    const {error}=await sbClient.from('hardwork_state').upsert({user_id:sessionUser.id,data:stateObject()},{onConflict:'user_id'});
    if(error)throw error;
    cloudLastSync=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    updateCloudBar(null,'ok');
    if(!silent)showToast('Dados salvos na nuvem');
  }catch(err){console.error(err);updateCloudBar('Erro ao salvar nuvem','err');if(!silent)alert('Erro ao salvar na nuvem: '+err.message);}
}
async function cloudLoadNow(force=false){
  if(!cloudUser||!sbClient){openCloudLogin();return;}
  try{
    const sessionUser=await getCloudSessionUser();
    if(!sessionUser){
      updateCloudBar('Entre na nuvem','err');
      openCloudLogin();
      return;
    }
    updateCloudBar('Baixando nuvem...');
    const {data,error}=await sbClient.from('hardwork_state').select('data,updated_at').eq('user_id',sessionUser.id).maybeSingle();
    if(error)throw error;
    if(!data?.data||!data.data.tasks){
      await cloudSaveNow(true);
      showToast('Nuvem iniciada com seus dados locais');
      return;
    }
    if(force&&!confirm('Baixar dados da nuvem e substituir o que está aberto neste navegador?')){updateCloudBar();return;}
    if(!force&&tasks.length>0&&!localStorage.getItem('hw_cloud_first_load_ok')){
      const useCloud=confirm('Encontrei dados na nuvem. Deseja carregar a versão da nuvem neste navegador? Cancelar mantém os dados locais e envia para a nuvem.');
      localStorage.setItem('hw_cloud_first_load_ok','1');
      if(!useCloud){await cloudSaveNow(true);return;}
    }
    cloudApplying=true;
    applyState(JSON.stringify(data.data));
    cloudApplying=false;
    cloudLastSync=new Date(data.updated_at||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    updateCloudBar(null,'ok');render();
    showToast('Dados carregados da nuvem');
  }catch(err){cloudApplying=false;console.error(err);updateCloudBar('Erro ao baixar nuvem','err');alert('Erro ao baixar da nuvem: '+err.message);}
}
function openCloudLogin(){
  closeMobileNav();
  document.getElementById('modal').innerHTML=`<div class="mbk" data-mode="cloud-login" onclick="closeMB(event)"><div class="mo" onclick="event.stopPropagation()" style="max-width:440px"><div class="mo-main">
    <div class="mo-hdr"><span class="mo-title">Entrar na nuvem</span><button class="ib" style="margin-left:auto" onclick="closeModalNoSave()">&#10005;</button></div>
    <div class="mo-body">
      <div class="bulk-help">Use e-mail e senha para sincronizar o Hardwork com o Supabase. No primeiro acesso, se a nuvem estiver vazia, seus dados locais serão enviados para lá.</div>
      <div class="ff"><label class="fl">E-mail</label><input type="text" id="cloud-email" autocomplete="email" placeholder="seu@email.com"></div>
      <div class="ff"><label class="fl">Senha</label><input type="password" id="cloud-pass" autocomplete="current-password" placeholder="Senha"></div>
    </div>
    <div class="mo-foot"><button class="btn-c" onclick="closeModalNoSave()">Cancelar</button><button class="btn-c" onclick="cloudAuth(true)">Criar conta</button><button class="btn-p" onclick="cloudAuth(false)">Entrar</button></div>
  </div></div></div>`;
  setTimeout(()=>document.getElementById('cloud-email')?.focus(),10);
}
async function cloudAuth(signup=false){
  if(!sbClient&&window.supabase)sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  if(!sbClient)return alert('Biblioteca Supabase não carregou. Verifique sua conexão com a internet.');
  const email=(document.getElementById('cloud-email')?.value||'').trim();
  const password=document.getElementById('cloud-pass')?.value||'';
  if(!email||!password)return alert('Preencha e-mail e senha.');
  try{
    const res=signup?await sbClient.auth.signUp({email,password}):await sbClient.auth.signInWithPassword({email,password});
    if(res.error)throw res.error;
    cloudUser=res.data?.session?.user||null;
    closeModalNoSave();
    if(!res.data?.session){
      cloudUser=null;
      updateCloudBar('Confirme o e-mail e entre','err');
      alert(signup?'Conta criada. Confirme o e-mail e depois clique em Entrar com a mesma senha.':'Entrada não concluída. Confirme o e-mail e tente entrar novamente.');
      return;
    }
    updateCloudBar(null,'ok');
    await cloudLoadNow(false);
  }catch(err){alert((signup?'Erro ao criar conta: ':'Erro ao entrar: ')+err.message);}
}
async function cloudSignOut(){
  if(sbClient)await sbClient.auth.signOut();
  cloudUser=null;cloudLastSync='';updateCloudBar();render();showToast('Nuvem desconectada');
}

// ── BACKUP ────────────────────────────────────────────────────────────────────
function exportJSON(){
  const data={
    _version:SCHEMA_VERSION,
    _exported:new Date().toISOString(),
    _app:'HardWork Leo Mota',
    tasks,notes,studies,routines,columns,globalLabels,globalClients,PROJECTS,PC,typeOptions,priorityOptions
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`hardwork_backup_${todayStr}.json`;
  a.click();URL.revokeObjectURL(url);
  const last=document.getElementById('bb-last');
  if(last)last.textContent='Último export: '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  showToast('Backup exportado com sucesso');
}
function importJSON(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.tasks||!Array.isArray(data.tasks))throw new Error('Formato inválido');
      if(!confirm(`Importar ${data.tasks.length} tarefas?\nIsso substituirá os dados atuais. (Você pode desfazer com Ctrl+Z)`))return;
      snapshot();
      // migrate / fill missing fields
      data.tasks.forEach(t=>{
        if(!t.sessions)t.sessions=[];if(!t.history)t.history=[];if(!t.labels)t.labels=[];
        if(t.totalTime===undefined)t.totalTime=0;if(!t.project)t.project='';if(!t.client)t.client='';
      });
      tasks=data.tasks;
      if(data.notes&&Array.isArray(data.notes))notes=data.notes;
      if(data.studies&&Array.isArray(data.studies))studies=data.studies;
      if(data.routines&&Array.isArray(data.routines))routines=data.routines;
      if(data.columns&&Array.isArray(data.columns))columns=data.columns;
      if(data.globalLabels&&Array.isArray(data.globalLabels))globalLabels=data.globalLabels;
      if(data.globalClients&&Array.isArray(data.globalClients))globalClients=data.globalClients;
      if(data.PROJECTS&&Array.isArray(data.PROJECTS))PROJECTS=data.PROJECTS;
      if(data.PC&&typeof data.PC==='object')PC=data.PC;
      if(data.typeOptions&&Array.isArray(data.typeOptions))typeOptions=data.typeOptions;
      if(data.priorityOptions&&Array.isArray(data.priorityOptions))priorityOptions=data.priorityOptions;
      studies.forEach(c=>{if(!c.lessons)c.lessons=[];if(!c.project)c.project='';if(!c.priority)c.priority='med';if(!c.notes)c.notes='';});
      nextId=Math.max(...tasks.map(t=>t.id),0)+1;
      persist();
      showToast(`${tasks.length} tarefas importadas com sucesso`);
    }catch(err){alert('Erro ao importar: '+err.message);}
    input.value='';
  };
  reader.readAsText(file);
}
