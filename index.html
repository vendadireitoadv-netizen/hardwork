<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>HardWork Leo Mota</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232C5FE4'/%3E%3Cpath d='M35 8 18 36h13l-2 20 17-30H33z' fill='%23FF9F1C'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%232C5FE4'/%3E%3Cpath d='M99 22 50 101h38l-6 57 49-86H94z' fill='%23FF9F1C'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F7F6F3;--surf:#FFF;--surf2:#F0EEE9;--surf3:#E8E5DE;
  --brd:rgba(0,0,0,0.08);--brd2:rgba(0,0,0,0.14);
  --tx:#1A1916;--tx2:#6B6860;--tx3:#A09D96;
  --acc:#2C5FE4;--acc-bg:#EEF2FD;--acc-tx:#1A3FA0;
  --ok-bg:#EAF3DE;--ok-tx:#27500A;
  --warn-bg:#FAEEDA;--warn-tx:#633806;
  --err-bg:#FAECE7;--err-tx:#993C1D;
  --meet-bg:#E6F1FB;--meet-tx:#0C447C;
  --r:8px;--rl:12px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --sh2:0 8px 32px rgba(0,0,0,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;overflow:hidden}
.lay{display:flex;height:100vh;min-height:100vh;overflow:hidden}

/* SIDEBAR */
.sb{width:230px;height:100vh;overflow-y:auto;overflow-x:hidden;background:var(--surf);border-right:1px solid var(--brd);display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:16px 16px 13px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--brd)}
.sb-logo-icon{width:32px;height:32px;background:var(--acc);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.sb-logo-text{font-size:12px;font-weight:600;color:var(--tx);line-height:1.3}
.sb-sec{padding:13px 10px 5px;font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--r);margin:1px 8px;cursor:pointer;font-size:13px;color:var(--tx2);transition:all .15s;border:none;background:transparent;width:calc(100% - 16px);text-align:left;font-family:'DM Sans',sans-serif}
.sb-item:hover{background:var(--surf2);color:var(--tx)}
.sb-item.active{background:var(--acc-bg);color:var(--acc-tx);font-weight:500}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-foot{margin-top:auto;padding:11px 10px;border-top:1px solid var(--brd);display:flex;flex-direction:column;gap:8px}
.sb-timer{background:#FFF0F0;border:1px solid #FECACA;border-radius:var(--r);padding:9px 11px;display:none}
.sb-timer.on{display:block}
.sb-timer-lbl{font-size:10px;font-weight:700;color:var(--err-tx);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.sb-timer-title{font-size:12px;font-weight:500;color:var(--tx);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-timer-row{display:flex;align-items:center;justify-content:space-between}
.sb-clock{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:var(--err-tx)}
.sb-stop{width:26px;height:26px;border-radius:var(--r);border:none;background:var(--err-tx);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px}
.sb-add{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--r);background:var(--acc);color:#fff;font-size:13px;font-weight:500;cursor:pointer;border:none;width:100%;transition:all .15s;font-family:'DM Sans',sans-serif;justify-content:center}
.sb-add:hover{background:#1a4fd6}
.top-add{width:auto;padding:7px 12px;white-space:nowrap}
.top-manage{width:auto;padding:7px 10px;white-space:nowrap;background:var(--surf2);color:var(--tx2)}
.top-manage:hover{background:var(--surf3);color:var(--tx)}
.quick-search{height:34px;display:flex;align-items:center;gap:6px;border:1px solid var(--brd2);background:var(--surf);border-radius:var(--r);padding:0 8px;color:var(--tx3)}
.quick-search input{width:170px;border:none;background:transparent;outline:none;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--tx)}
.quick-search input::placeholder{color:var(--tx3)}

/* TOPBAR */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--surf);border-bottom:1px solid var(--brd);padding:0 20px;display:flex;align-items:center;height:52px;gap:10px;position:sticky;top:0;z-index:120;flex-shrink:0}
.page-title{font-size:15px;font-weight:600;color:var(--tx)}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.view-tabs{display:flex;gap:2px;background:var(--surf2);border-radius:var(--r);padding:3px}
.view-tab{padding:5px 11px;border-radius:6px;border:none;background:transparent;font-size:12px;color:var(--tx2);cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;font-family:'DM Sans',sans-serif}
.view-tab:hover{color:var(--tx)}
.view-tab.active{background:var(--surf);color:var(--tx);font-weight:500;box-shadow:var(--sh)}
.tb-icon-btn{width:34px;height:34px;border-radius:var(--r);border:1px solid var(--brd2);background:var(--surf);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:17px;position:relative;transition:all .15s;text-decoration:none}
.tb-icon-btn:hover{background:var(--surf2)}
.notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:#EF4444;border-radius:50%;border:1.5px solid var(--surf);display:none}
.content{padding:18px 22px;flex:1;overflow-y:auto;min-height:0}
.mobile-menu-btn,.sb-backdrop{display:none}
.cloud-lock{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.cloud-lock-card{width:min(420px,100%);background:var(--surf);border:1px solid var(--brd);border-radius:var(--rl);box-shadow:var(--sh);padding:22px;text-align:left}
.cloud-lock-logo{width:42px;height:42px;border-radius:var(--r);background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;margin-bottom:14px}
.cloud-lock-title{font-size:19px;font-weight:700;color:var(--tx);margin-bottom:8px}
.cloud-lock-text{font-size:13px;color:var(--tx2);line-height:1.45;margin-bottom:16px}
.cloud-lock-actions{display:flex;gap:8px;flex-wrap:wrap}

/* TAGS */
.tag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.tag-high{background:var(--err-bg);color:var(--err-tx)}
.tag-med{background:var(--warn-bg);color:var(--warn-tx)}
.tag-low{background:var(--ok-bg);color:var(--ok-tx)}
.tag-meeting{background:var(--meet-bg);color:var(--meet-tx)}
.tag-task{background:var(--ok-bg);color:var(--ok-tx)}
.tag-date{background:var(--surf2);color:var(--tx2);display:inline-flex;align-items:center;gap:3px}
.tag-date.editable{border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.tag-date.editable:hover{background:var(--acc-bg);color:var(--acc-tx)}
.inline-date-input{height:21px;border:1px solid var(--acc);border-radius:20px;background:var(--surf);color:var(--tx);font-size:11px;font-family:'DM Sans',sans-serif;padding:1px 6px}
.proj-tag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.pc-Dropship{background:#F3EFFE;color:#5B21B6}
.pc-Consultoria{background:#E6F1FB;color:#0C447C}
.pc-BotAgent{background:#FFF0F5;color:#9D174D}
.pc-Forecast{background:#FEF9C3;color:#713F12}
.pc-Pessoal{background:#F0FDF4;color:#14532D}

/* LIST */
.list-top{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.list-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bulk-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surf);border:1px solid var(--brd);border-radius:var(--rl);padding:9px 11px;margin-bottom:14px;box-shadow:var(--sh)}
.bulk-count{font-size:12px;font-weight:600;color:var(--tx)}
.bulk-date{padding:5px 8px;border-radius:var(--r);border:1px solid var(--brd2);background:var(--surf);font-size:12px;font-family:'DM Sans',sans-serif}
.bulk-check{width:16px;height:16px;flex-shrink:0;cursor:pointer}
.adv-filter{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-left:auto}
.adv-filter select{width:auto;min-width:128px;padding:5px 8px;border-radius:20px}
.adv-filter .btn-c{padding:5px 11px;border-radius:20px}
.adv-filter-lbl{font-size:10px;color:var(--tx3);font-weight:700;text-transform:uppercase}
.fp{padding:5px 11px;border-radius:20px;border:1px solid var(--brd2);background:var(--surf);font-size:12px;color:var(--tx2);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:5px}
.fp:hover{border-color:var(--acc);color:var(--acc)}
.fp.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
.fp-sep{width:1px;height:22px;background:var(--brd2);margin:0 2px;flex-shrink:0}
.fp-proj{padding:5px 11px;border-radius:20px;border:1px solid var(--brd2);background:var(--surf);font-size:12px;color:var(--tx2);cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:5px}
.fp-proj:hover{border-color:var(--acc);color:var(--acc)}
.fp-proj.on-Dropship{background:#F3EFFE;border-color:#5B21B6;color:#5B21B6;font-weight:500}
.fp-proj.on-Consultoria{background:#E6F1FB;border-color:#0C447C;color:#0C447C;font-weight:500}
.fp-proj.on-BotAgent{background:#FFF0F5;border-color:#9D174D;color:#9D174D;font-weight:500}
.fp-proj.on-Forecast{background:#FEF9C3;border-color:#713F12;color:#713F12;font-weight:500}
.fp-proj.on-Pessoal{background:#F0FDF4;border-color:#14532D;color:#14532D;font-weight:500}

.grp{margin-bottom:20px}
.grp.hot{background:var(--acc-bg);outline:1.5px dashed var(--acc);outline-offset:4px;border-radius:var(--rl)}
.grp.drop-ready{outline:1.5px dashed var(--brd2);outline-offset:4px;border-radius:var(--rl)}
.grp-hdr{display:flex;align-items:center;gap:7px;padding:0 2px;margin-bottom:7px}
.grp-hdr.hot{background:var(--acc-bg);border-radius:var(--r)}
.grp-lbl{font-size:12px;font-weight:500;color:var(--tx2)}
.grp-line{flex:1;height:1px;background:var(--brd)}
.grp-cnt{font-size:11px;color:var(--tx3);background:var(--surf2);padding:1px 7px;border-radius:20px}

.ti{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rl);padding:10px 12px;margin-bottom:5px;display:flex;align-items:center;gap:9px;transition:all .15s;box-shadow:var(--sh);cursor:default}
.ti:hover{border-color:var(--brd2)}
.ti.trk{border-color:#EF4444;box-shadow:0 0 0 2px rgba(239,68,68,.1)}
.ti.overdue{border-color:#EF4444;background:#FFF7F5;box-shadow:0 0 0 2px rgba(239,68,68,.08)}
.ti.done-row{opacity:.6}
.ti[draggable=true]{cursor:grab}
.ti.dragging{opacity:.3;cursor:grabbing}
.tchk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--brd2);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:11px}
.tchk:hover{border-color:var(--acc)}
.tchk.done{background:var(--ok-bg);border-color:#3B6D11;color:var(--ok-tx)}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttitle{font-size:13px;font-weight:500;color:var(--tx);margin-bottom:3px;line-height:1.4}
.ttitle.done{text-decoration:line-through;color:var(--tx3);font-weight:400}
.tmeta{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.ttime{font-size:11px;display:inline-flex;align-items:center;gap:3px;font-family:'DM Mono',monospace;background:var(--surf2);padding:1px 6px;border-radius:20px;color:var(--tx3)}
.ttime.run{color:var(--err-tx);background:var(--err-bg);font-weight:500}
.t-btns{display:flex;gap:5px;flex:0 0 auto;align-items:center}
input[type=text].order-input{width:30px;min-width:30px;max-width:30px;height:30px;padding:0;border-radius:var(--r);border:1px solid var(--brd);background:var(--surf2);color:var(--tx);font-family:'DM Mono',monospace;font-size:11px;text-align:center;outline:none;flex:0 0 30px}
.order-input:focus{border-color:var(--acc);background:var(--surf)}
.order-input::-webkit-outer-spin-button,.order-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.act-btn{width:30px;height:30px;border-radius:var(--r);border:none;background:var(--surf2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--tx2);transition:all .15s;flex-shrink:0}
.act-btn:hover{background:var(--surf3);color:var(--tx)}
.act-btn.play-idle:hover{background:var(--ok-bg);color:var(--ok-tx)}
.act-btn.play-on{background:#EF4444 !important;color:#fff !important;animation:pulse 1.4s ease-in-out infinite}
.act-btn.drag-handle{cursor:grab}
.act-btn.drag-handle:active{cursor:grabbing}
.act-btn.drag-handle:hover{background:var(--acc-bg);color:var(--acc-tx)}
.act-btn.del:hover{background:var(--err-bg);color:var(--err-tx)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 5px rgba(239,68,68,0)}}

.dz{border:1.5px dashed var(--brd2);border-radius:var(--rl);padding:8px;margin-bottom:5px;display:none;min-height:36px;align-items:center;justify-content:center;font-size:12px;color:var(--tx3);transition:all .15s}
.dz.vis{display:flex}
.dz.hot{border-color:var(--acc);background:var(--acc-bg);color:var(--acc-tx)}

/* KANBAN */
.kb-wrap{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kb-col{min-width:220px;width:240px;flex-shrink:0;display:flex;flex-direction:column}
.kb-col-hdr{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--r);margin-bottom:8px;cursor:grab}
.kb-col.drag-col{opacity:.45}
.kb-col.col-target{outline:1.5px dashed var(--acc);outline-offset:3px;border-radius:var(--r)}
.kb-col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.kb-col-name{font-size:12px;font-weight:500;flex:1;cursor:pointer;border:none;background:transparent;font-family:'DM Sans',sans-serif;color:inherit;padding:0;outline:none}
.kb-col-name:focus{background:rgba(255,255,255,.5);border-radius:4px;padding:1px 4px}
.kb-col-cnt{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:500}
.kb-col-del{width:22px;height:22px;border-radius:5px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:inherit;font-size:13px;opacity:.5;transition:opacity .15s}
.kb-col-del:hover{opacity:1;background:rgba(0,0,0,.1)}
.kb-cards{min-height:40px;padding:2px;border-radius:var(--r);transition:all .15s}
.kb-cards.drag-on{background:var(--acc-bg);outline:1.5px dashed var(--acc);outline-offset:-2px}
.kc{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rl);padding:10px 11px;margin-bottom:7px;cursor:grab;transition:all .15s;box-shadow:var(--sh)}
.kc:hover{border-color:var(--brd2);transform:translateY(-1px)}
.kc.dragging{opacity:.3;cursor:grabbing;transform:rotate(2deg)}
.kc.drag-ph{border:1.5px dashed var(--acc);background:var(--acc-bg);opacity:.5;box-shadow:none;height:52px}
.kc.trk{border-color:#EF4444}
.kc-title{font-size:12px;font-weight:500;color:var(--tx);margin-bottom:7px;line-height:1.4}
.kc-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.kc-date{font-size:11px;color:var(--tx3);display:inline-flex;align-items:center;gap:3px}
.kc-prog{height:3px;background:var(--surf2);border-radius:2px;overflow:hidden;margin-top:6px}
.kc-prog-f{height:100%;background:#639922;border-radius:2px}
.kc-time{margin-top:5px;font-size:11px;color:var(--tx3);font-family:'DM Mono',monospace;display:flex;align-items:center;gap:3px}
.kb-add-btn{width:100%;padding:8px;border-radius:var(--r);border:1px dashed var(--brd2);background:transparent;color:var(--tx3);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px;margin-top:2px}
.kb-add-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.kb-new-col{min-width:160px;display:flex;align-items:flex-start;padding-top:2px}
.add-col-btn{padding:8px 14px;border-radius:var(--r);border:1.5px dashed var(--brd2);background:transparent;color:var(--tx3);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:all .15s}
.add-col-btn:hover{border-color:var(--acc);color:var(--acc)}

/* CALENDAR */
.cal-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal-mo{font-size:16px;font-weight:600;color:var(--tx)}
.cal-grid{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surf2);border-bottom:1px solid var(--brd)}
.cal-dl{padding:8px;text-align:center;font-size:11px;font-weight:500;color:var(--tx3)}
.cal-cells{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{border-right:1px solid var(--brd);border-bottom:1px solid var(--brd);min-height:82px;padding:5px;cursor:pointer;transition:background .1s}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:var(--surf2)}
.cal-cell.today{background:var(--acc-bg)}
.cal-cell.drag-on{background:var(--warn-bg);outline:1.5px dashed #854F0B;outline-offset:-2px}
.cal-cell.other .cal-dn{color:var(--tx3)}
.cal-dn{font-size:11px;font-weight:500;color:var(--tx2);margin-bottom:3px}
.cal-cell.today .cal-dn{color:#fff;background:var(--acc);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;margin-bottom:3px}
.cal-ev{font-size:10px;padding:2px 4px;border-radius:3px;margin-bottom:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.cal-event-time{font-family:'DM Mono',monospace;font-weight:800;margin-right:3px}
.cal-ev.has-time{font-size:10.5px;padding:3px 5px}
.cal-ev.no-time{opacity:.82}
.cal-legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.cal-legend .tag{font-size:10px}
.cal-ev.meet-commercial,.cal-ev.meet-operational,.cal-ev.personal-ev{font-weight:700;border-left:3px solid currentColor;padding-left:5px}
.cal-ev.meet-commercial{box-shadow:inset 0 0 0 1px #B91C1C44}
.cal-ev.meet-operational{box-shadow:inset 0 0 0 1px #0F766E44}
.cal-ev.personal-ev{box-shadow:inset 0 0 0 1px #14532D44}
.cal-ev.meet{background:var(--meet-bg);color:var(--meet-tx)}
.cal-ev.task-ev{background:var(--ok-bg);color:var(--ok-tx)}
.cal-ev.urg{background:var(--err-bg);color:var(--err-tx)}
.cal-more{font-size:10px;color:var(--acc);background:transparent;border:none;cursor:pointer;padding:1px 0;text-decoration:underline}

/* DASHBOARD */
.dash-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.per-row{display:flex;gap:3px}
.per-btn{padding:4px 10px;border-radius:20px;border:1px solid var(--brd2);background:var(--surf);font-size:11px;color:var(--tx3);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.per-btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rl);padding:14px 16px;box-shadow:var(--sh)}
.kpi-lbl{font-size:10px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.kpi-val{font-size:24px;font-weight:600;color:var(--tx);font-family:'DM Mono',monospace;line-height:1}
.kpi-sub{font-size:11px;color:var(--tx3);margin-top:4px}
.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:700px){.dash-row{grid-template-columns:1fr}}
.dc{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rl);padding:16px;box-shadow:var(--sh)}
.dc-title{font-size:10px;font-weight:700;color:var(--tx3);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-lbl{font-size:12px;color:var(--tx2);width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-wrap{flex:1;height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px;transition:width .5s}
.bar-v{font-size:11px;color:var(--tx3);width:42px;text-align:right;font-family:'DM Mono',monospace;flex-shrink:0}
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.leg-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.leg-item{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--tx2)}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.log-table{width:100%;border-collapse:collapse;font-size:12px}
.log-table th{text-align:left;font-size:10px;color:var(--tx3);font-weight:700;padding:0 6px 8px 0;border-bottom:1px solid var(--brd);text-transform:uppercase}
.log-table td{padding:7px 6px 7px 0;border-bottom:1px solid var(--brd);color:var(--tx2)}
.log-table td:last-child{text-align:right;font-family:'DM Mono',monospace;color:var(--tx);font-weight:500}
.log-table tr:last-child td{border-bottom:none}
.log-scroll{max-height:260px;overflow-y:auto;padding-right:4px}
.dash-wide{grid-column:1/-1}
.day-bars{display:flex;flex-direction:column;gap:9px}
.day-row{display:grid;grid-template-columns:92px 1fr 58px;gap:9px;align-items:center}
.day-lbl{font-size:12px;color:var(--tx2)}
.no-data{text-align:center;padding:20px;color:var(--tx3);font-size:12px}

/* NOTES */
.notes-wrap{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:start}
.notes-side,.notes-main{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rl);box-shadow:var(--sh)}
.notes-side{padding:12px;max-height:calc(100vh - 120px);overflow-y:auto}
.notes-main{padding:16px;min-height:420px}
.note-group{margin-bottom:13px}
.note-group-title{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.note-item{width:100%;border:none;background:transparent;text-align:left;padding:8px;border-radius:var(--r);cursor:pointer;color:var(--tx2);font-family:'DM Sans',sans-serif}
.note-item:hover,.note-item.on{background:var(--surf2);color:var(--tx)}
.note-item[draggable=true]{cursor:grab}
.note-item.dragging{opacity:.35;cursor:grabbing}
.note-row{display:flex;gap:6px;align-items:flex-start;border-radius:var(--r)}
.note-row.drop-note{outline:1.5px dashed var(--acc);background:var(--acc-bg)}
.note-pin{width:26px;height:26px;border:none;border-radius:var(--r);background:var(--surf2);color:var(--tx3);cursor:pointer;flex-shrink:0}
.note-pin.on{background:var(--warn-bg);color:var(--warn-tx)}
.note-title{font-size:13px;font-weight:600;color:inherit;margin-bottom:3px}
.note-preview{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-empty{padding:50px 12px;text-align:center;color:var(--tx3);font-size:13px}
.note-doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-bottom:1px solid var(--brd);padding-bottom:12px;margin-bottom:14px}
.note-doc-title{font-size:20px;font-weight:600;color:var(--tx);line-height:1.2}
.note-doc-body{white-space:normal;line-height:1.55;color:var(--tx);font-size:14px}

/* STUDIES */
.study-wrap{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
.study-side,.study-main{background:var(--surf);border:1px solid var(--brd);border-radius:var(--rl);box-shadow:var(--sh)}
.study-side{padding:12px;max-height:calc(100vh - 120px);overflow-y:auto}
.study-main{padding:16px;min-height:420px}
.study-item{width:100%;border:none;background:transparent;text-align:left;padding:9px;border-radius:var(--r);cursor:pointer;color:var(--tx2);font-family:'DM Sans',sans-serif;margin-top:5px}
.study-item:hover,.study-item.on{background:var(--surf2);color:var(--tx)}
.study-title{font-size:13px;font-weight:600;color:inherit;margin-bottom:4px}
.study-meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.study-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--brd);padding-bottom:12px;margin-bottom:14px}
.study-name{font-size:20px;font-weight:600;color:var(--tx);line-height:1.2;margin-bottom:7px}
.study-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.study-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.study-kpi{background:var(--surf2);border:1px solid var(--brd);border-radius:var(--r);padding:10px}
.study-kpi span{display:block;font-size:10px;color:var(--tx3);font-weight:700;text-transform:uppercase;margin-bottom:5px}
.study-kpi strong{font-size:18px;font-family:'DM Mono',monospace;color:var(--tx)}
.lesson-list{display:flex;flex-direction:column;gap:7px}
.lesson-row{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;background:var(--surf);border:1px solid var(--brd);border-radius:var(--rl);padding:10px 11px;box-shadow:var(--sh)}
.lesson-row.done{opacity:.62}
.lesson-main{min-width:0}
.lesson-title{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:4px}
.lesson-row.done .lesson-title{text-decoration:line-through;color:var(--tx3)}
.lesson-notes{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:680px}
.lesson-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lesson-check{width:18px;height:18px;cursor:pointer}
.study-empty{padding:50px 12px;text-align:center;color:var(--tx3);font-size:13px}

/* NOTIF PANEL */
.np{position:fixed;top:52px;right:0;width:310px;background:var(--surf);border-left:1px solid var(--brd);border-bottom:1px solid var(--brd);border-radius:0 0 0 var(--rl);box-shadow:var(--sh2);z-index:150;display:none;max-height:400px;overflow-y:auto}
.np.open{display:block}
.np-hdr{padding:11px 14px;border-bottom:1px solid var(--brd);font-size:13px;font-weight:600;color:var(--tx);display:flex;align-items:center;justify-content:space-between}
.ni{padding:11px 14px;border-bottom:1px solid var(--brd);display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.ni:hover{background:var(--surf2)}
.ni:last-child{border-bottom:none}
.ni-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ni-icon.ov{background:var(--err-bg);color:var(--err-tx)}
.ni-icon.tod{background:var(--warn-bg);color:var(--warn-tx)}
.ni-text{font-size:12px;color:var(--tx2);line-height:1.4}
.ni-text strong{color:var(--tx);font-weight:500}
.ni-del{margin-left:auto;border:none;background:transparent;color:#DC2626;cursor:pointer;font-size:14px;line-height:1;opacity:.75}
.ni-del:hover{opacity:1}
.np-empty{padding:24px;text-align:center;font-size:13px;color:var(--tx3)}

/* MODAL */
.mbk{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;z-index:200;padding:14px}
.mo{background:var(--surf);border-radius:var(--rl);border:1px solid var(--brd);width:100%;max-width:980px;max-height:94vh;overflow:hidden;box-shadow:var(--sh2);display:flex;flex-direction:column}
.mo-inner{display:flex;flex:1;min-height:0;overflow:hidden}
.mo-main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.mo-hdr{padding:13px 18px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:8px;flex-shrink:0}
.mo-title{font-size:14px;font-weight:600;color:var(--tx)}
.mo-body{padding:16px 18px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;flex:1}
.mo-foot{padding:10px 18px;border-top:1px solid var(--brd);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.mo-side{width:255px;border-left:1px solid var(--brd);display:flex;flex-direction:column;flex-shrink:0;background:var(--surf2)}
.mo-side-hdr{padding:11px 13px;border-bottom:1px solid var(--brd);font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;background:var(--surf)}
.hist-list{flex:1;overflow-y:auto;padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.hist-item{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:7px 9px}
.hist-text{font-size:12px;color:var(--tx);line-height:1.4;margin-bottom:2px}
.hist-text a,.rte-body a,.note-doc-body a{color:var(--acc);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.hist-time{font-size:10px;color:var(--tx3)}
.hist-inp-wrap{padding:9px 11px;border-top:1px solid var(--brd);display:flex;gap:6px;background:var(--surf);flex-shrink:0}
.hist-inp{flex:1;padding:6px 8px;border-radius:var(--r);border:1px solid var(--brd2);background:var(--surf);color:var(--tx);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;resize:none;min-height:32px;max-height:80px}
.hist-inp:focus{border-color:var(--acc)}
.hist-send{width:28px;height:28px;border-radius:var(--r);border:none;background:var(--acc);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;align-self:flex-end}
.hist-send:hover{background:#1a4fd6}

/* FORM */
.ff{display:flex;flex-direction:column;gap:4px}
.fl{font-size:11px;font-weight:500;color:var(--tx2)}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr-time-label{display:grid;grid-template-columns:minmax(120px,180px) minmax(0,2fr);gap:10px}
input[type=text],input[type=password],input[type=date],select,.ta{width:100%;padding:7px 9px;border-radius:var(--r);border:1px solid var(--brd2);background:var(--surf);color:var(--tx);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
input[type=text]:focus,input[type=password]:focus,input[type=date]:focus,select:focus,.ta:focus{border-color:var(--acc)}
.ta{resize:vertical;min-height:50px}
.tw{position:relative}
.tdrop{position:absolute;top:calc(100%+3px);left:0;right:0;background:var(--surf);border:1px solid var(--brd2);border-radius:var(--r);max-height:160px;overflow-y:auto;z-index:300;box-shadow:var(--sh2)}
.to{padding:6px 9px;font-size:12px;cursor:pointer;color:var(--tx);font-family:'DM Sans',sans-serif}
.to:hover{background:var(--surf2)}
.sub-list{display:flex;flex-direction:column;gap:4px}
.sub-item{display:flex;align-items:center;gap:7px;padding:6px 9px;background:var(--surf2);border-radius:var(--r);font-size:12px}
.sub-text{flex:1;color:var(--tx)}
.add-row{display:flex;gap:7px;margin-top:4px}
.add-row input{flex:1}
.btn-p{padding:7px 15px;border-radius:var(--r);border:none;background:var(--acc);color:#fff;font-size:12px;cursor:pointer;font-weight:500;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-p:hover{background:#1a4fd6}
.btn-c{padding:7px 15px;border-radius:var(--r);border:1px solid var(--brd2);background:transparent;color:var(--tx2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-c:hover{background:var(--surf2)}
.ib{width:26px;height:26px;border-radius:var(--r);border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:13px;transition:all .15s}
.ib:hover{background:var(--surf2);color:var(--tx)}
.field-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.field-tab{padding:6px 10px;border-radius:20px;border:1px solid var(--brd2);background:var(--surf);font-size:12px;color:var(--tx2);cursor:pointer;font-family:'DM Sans',sans-serif}
.field-tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.field-list{display:flex;flex-direction:column;gap:7px}
.field-row{display:grid;grid-template-columns:1fr 82px auto;gap:7px;align-items:center;background:var(--surf2);border-radius:var(--r);padding:8px}
.field-row.no-color{grid-template-columns:1fr auto}
.field-row input[type=text]{background:var(--surf)}
.field-row input[type=color]{width:46px;height:32px;border:1px solid var(--brd2);border-radius:var(--r);padding:2px;background:var(--surf);cursor:pointer}
.field-del{border:none;background:transparent;color:var(--err-tx);cursor:pointer;font-size:15px;width:28px;height:28px;border-radius:var(--r)}
.field-del:hover{background:var(--err-bg)}
.field-add{display:flex;gap:7px;margin-top:10px;align-items:center}

/* RTE */
.rte-wrap{border:1px solid var(--brd2);border-radius:var(--r);overflow:hidden;background:var(--surf)}
.rte-wrap:focus-within{border-color:var(--acc)}
.rte-tb{display:flex;align-items:center;gap:1px;padding:4px 7px;border-bottom:1px solid var(--brd);background:var(--surf2);flex-wrap:wrap}
.rb{width:26px;height:26px;border-radius:5px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx2);font-family:'DM Sans',sans-serif;font-weight:600;transition:all .15s;flex-shrink:0}
.rb:hover{background:var(--surf3);color:var(--tx)}
.rb.on{background:var(--acc-bg);color:var(--acc)}
.r-sep{width:1px;height:18px;background:var(--brd2);margin:0 3px;flex-shrink:0}
.r-sel{padding:3px 5px;border-radius:5px;border:1px solid var(--brd);background:var(--surf);font-size:11px;font-family:'DM Sans',sans-serif;color:var(--tx2);cursor:pointer;outline:none;height:26px}
.r-color{width:26px;height:26px;border-radius:5px;border:1px solid var(--brd);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;background:transparent;flex-shrink:0}
.r-color input[type=color]{position:absolute;width:200%;height:200%;top:-50%;left:-50%;opacity:0;cursor:pointer}
.r-color-icon{font-size:13px;color:var(--tx2);pointer-events:none}
.rte-body{min-height:90px;max-height:180px;overflow-y:auto;padding:8px 10px;font-size:13px;color:var(--tx);outline:none;line-height:1.5}
.rte-body ul,.rte-body ol{margin:6px 0 6px 24px;padding-left:12px}
.rte-body li{padding-left:3px;margin:2px 0}
.rte-body img,.note-doc-body img{max-width:100%;border-radius:var(--r);border:1px solid var(--brd);margin:6px 0;display:block}

/* TIME TRACK */
.tt-box{background:var(--surf2);border-radius:var(--r);padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.tt-hdr{display:flex;align-items:center;justify-content:space-between}
.tt-total{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--tx)}
.tt-lbl{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.tt-sessions{display:flex;flex-direction:column;gap:3px;max-height:90px;overflow-y:auto}
.tt-sess{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--tx3);padding:3px 0;border-bottom:1px solid var(--brd)}
.tt-sess:last-child{border-bottom:none}
.tt-sess-actions{display:flex;gap:4px;align-items:center}
.tt-sedit{cursor:pointer;color:var(--acc);font-weight:700}
.routine-wrap{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
.routine-card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:10px;margin-bottom:8px;box-shadow:var(--sh)}
.routine-title{font-weight:600;color:var(--tx);font-size:14px;margin-bottom:6px}
.routine-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bulk-help{font-size:12px;color:var(--tx3);line-height:1.45;background:var(--surf2);border:1px solid var(--brd);border-radius:var(--r);padding:10px;margin-bottom:10px}
.tt-sdur{font-family:'DM Mono',monospace;color:var(--tx2);font-weight:500}
.tt-sdel{cursor:pointer;margin-left:6px;font-size:12px;color:var(--brd2)}
.tt-sdel:hover{color:var(--err-tx)}
.tt-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tt-pbtn{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:var(--r);border:none;cursor:pointer;font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;transition:all .15s}
.tt-pbtn.go{background:var(--ok-bg);color:var(--ok-tx)}
.tt-pbtn.go:hover{background:#C0DD97}
.tt-pbtn.stop{background:var(--err-bg);color:var(--err-tx)}
.tt-pbtn.stop:hover{background:#F7C1C1}
.pomo-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pomo-btn{padding:5px 11px;border-radius:20px;border:1px solid var(--brd2);background:var(--surf);font-size:11px;color:var(--tx2);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.pomo-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.pomo-btn.run{background:var(--err-bg);border-color:var(--err-tx);color:var(--err-tx)}
.pomo-clock{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--err-tx);padding:4px 8px;background:var(--err-bg);border-radius:20px}
.pomo-alert{position:fixed;right:18px;bottom:72px;z-index:1000;background:var(--err-bg);border:1px solid #FCA5A5;color:var(--err-tx);border-radius:var(--rl);box-shadow:var(--sh2);padding:13px 15px;display:flex;align-items:center;gap:12px;max-width:360px;cursor:pointer}
.pomo-alert strong{display:block;color:var(--tx);font-size:13px;margin-bottom:2px}
.pomo-alert button{border:none;background:var(--err-tx);color:#fff;border-radius:var(--r);padding:6px 10px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px}

/* LABELS & CLIENTS dropdowns */
.dd-wrap{position:relative;width:100%}
.dd-trigger{width:100%;padding:7px 9px;border-radius:var(--r);border:1px solid var(--brd2);background:var(--surf);color:var(--tx);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:left;transition:border-color .15s}
.dd-trigger:focus,.dd-trigger.open{border-color:var(--acc)}
.dd-chips{display:flex;flex-wrap:wrap;gap:3px;flex:1}
.dd-chip{font-size:11px;padding:1px 7px;border-radius:20px;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.dd-chip-x{cursor:pointer;opacity:.6;font-size:10px}
.dd-chip-x:hover{opacity:1}
.dd-placeholder{font-size:12px;color:var(--tx3)}
.dd-arrow{font-size:11px;color:var(--tx3);flex-shrink:0}
.dd-panel{position:absolute;top:calc(100%+3px);left:0;right:0;background:var(--surf);border:1px solid var(--brd2);border-radius:var(--r);box-shadow:var(--sh2);z-index:400;display:none;max-height:220px;overflow:hidden;flex-direction:column}
.dd-panel.open{display:flex}
.dd-search{padding:7px 9px;border-bottom:1px solid var(--brd);border:none;border-bottom:1px solid var(--brd);outline:none;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--tx);background:var(--surf);width:100%}

.dd-list{overflow-y:auto;flex:1}

<script>
// ── UNDO STACK ────────────────────────────────────────────────────────────────
const undoStack=[],redoStack=[];
const UNDO_MAX=30;
const SUPABASE_URL='https://sdgjjsavtekkrqejbwyo.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_HAk8CCXK5jy2oTbIRak4ug_XXOXM8av';
const CLOUD_LOGIN_REQUIRED=location.protocol==='https:';
let sbClient=null,cloudUser=null,cloudSaveTimer=null,cloudApplying=false,cloudLastSync='',cloudReady=false;
function stateObject(){return{_version:SCHEMA_VERSION,_savedAt:new Date().toISOString(),tasks,notes,studies,routines,columns,globalLabels,globalClients,PROJECTS,PC,typeOptions,priorityOptions,dismissedNot};}
function appState(){return JSON.stringify(stateObject());}
function isCloudLocked(){return CLOUD_LOGIN_REQUIRED&&(!cloudReady||!cloudUser);}

function applyState(raw){
  const st=JSON.parse(raw);
  tasks=st.tasks;notes=st.notes||notes;studies=st.studies||studies;routines=st.routines||routines;columns=st.columns;globalLabels=st.globalLabels;globalClients=st.globalClients||[];PROJECTS=st.PROJECTS||PROJECTS;PC=st.PC||PC;typeOptions=st.typeOptions||typeOptions;priorityOptions=st.priorityOptions||priorityOptions;dismissedNot=st.dismissedNot||[];

}
function snapshot(){
  undoStack.push(appState());redoStack.length=0;
  if(undoStack.length>UNDO_MAX)undoStack.shift();
}
document.addEventListener('keydown',e=>{
  const modalOpen=!!document.querySelector('#modal .mbk');
  if((e.ctrlKey||e.metaKey)&&e.code==='Space'){
    e.preventDefault();
    openNew();
    return;
  }
  if(!modalOpen&&curView==='notes'&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){
    e.preventDefault();
    openNoteEditor();
    return;
  }
  if(modalOpen&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){
    const box=document.querySelector('#modal .mbk');
    e.preventDefault();
    if(box?.dataset.mode==='new')saveNew();
    else if(box?.dataset.mode==='edit')saveEdit(+box.dataset.id);
    else if(box?.dataset.mode==='note')saveNote(+box.dataset.id||0);
    return;
  }
  if(modalOpen&&e.key==='Escape'){e.preventDefault();closeModalNoSave();return;}
  if(e.key==='Escape'&&(bulkMode||bulkSel.size)){e.preventDefault();clearBulk();return;}
  if(e.key==='Escape'&&(noteBulkMode||noteBulkSel.size)){e.preventDefault();clearNoteBulk();return;}
  const isUndo=(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey;
  const isRedo=(e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='z';
  if((isUndo||isRedo)&&isTextEditorTarget(e.target))return;
  if(isUndo||isRedo){
    const from=isUndo?undoStack:redoStack,to=isUndo?redoStack:undoStack;
    if(from.length){to.push(appState());applyState(from.pop());render();showToast(isUndo?'Ação desfeita':'Ação refeita');}
    e.preventDefault();
  }
});
function isTextEditorTarget(el){
  if(!el)return false;
  const tag=(el.tagName||'').toLowerCase();
  return el.isContentEditable||['input','textarea','select'].includes(tag)||!!el.closest?.('[contenteditable="true"]');
}
function showToast(msg){
  let t=document.getElementById('toast');

  t.textContent=msg;t.style.opacity='1';
  clearTimeout(t._to);t._to=setTimeout(()=>t.style.opacity='0',2000);
}

// ── POMODORO SOUND ────────────────────────────────────────────────────────────
let pomoMuted=false;
function playBeep(){
  if(pomoMuted)return;
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type='sine';osc.frequency.value=880;gain.gain.value=0.4;
    osc.start();osc.stop(ctx.currentTime+0.6);
    setTimeout(()=>{osc.frequency.value=1100;},200);
  }catch(e){}
}
function requestNotifyPermission(){
  if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});
}
function stopPomoAlert(){
  clearInterval(window._pomoAlertIv);clearTimeout(window._pomoAlertTo);
  const el=document.getElementById('pomo-alert');if(el)el.remove();
}
function triggerPomoAlert(msg,after){
  stopPomoAlert();playBeep();
  let left=10;
  const el=document.createElement('div');
  el.id='pomo-alert';el.className='pomo-alert';
  el.innerHTML=`<div><strong>Pomodoro concluído</strong><span id="pomo-alert-txt">${msg} ⬢ alerta por ${left}s</span></div><button type="button">Parar</button>`;
  el.onclick=stopPomoAlert;document.body.appendChild(el);
  window._pomoAlertIv=setInterval(()=>{left--;playBeep();const t=document.getElementById('pomo-alert-txt');if(t)t.textContent=`${msg} ⬢ alerta por ${Math.max(0,left)}s`;if(left<=0)stopPomoAlert();},1000);
  window._pomoAlertTo=setTimeout(stopPomoAlert,10000);
  if('Notification'in window&&Notification.permission==='granted'){
    const n=new Notification('Pomodoro concluído',{body:msg,requireInteraction:true});
    n.onclick=()=>{window.focus();stopPomoAlert();n.close();};
    setTimeout(()=>n.close(),10000);
  }
  if(after)after();
}

// ── TIME TRACKING ─────────────────────────────────────────────────────────────
let activeId=null,trkStart=null,trkIv=null;
let pomoOn=false,pomoEnd=null,pomoIv=null,pomoTid=null;

function startTracking(id){
  if(activeId!==null)stopTracking();
  activeId=id;trkStart=Date.now();
  const t=tasks.find(x=>x.id===id);
  document.getElementById('st-title').textContent=t?t.title:'';
  document.getElementById('sb-timer').classList.add('on');
  clearInterval(trkIv);trkIv=setInterval(tickTrk,1000);tickTrk();render();
}
function stopTracking(keepPomo=false){
  if(activeId===null)return;
  const wasActive=activeId;
  const dur=Math.floor((Date.now()-trkStart)/1000);
  const t=tasks.find(x=>x.id===activeId);
  if(t&&dur>0){t.totalTime=(t.totalTime||0)+dur;t.sessions.push({start:new Date(trkStart).toISOString(),end:new Date().toISOString(),dur});}
  activeId=null;trkStart=null;clearInterval(trkIv);trkIv=null;
  if(!keepPomo&&pomoOn&&pomoTid===wasActive){clearInterval(pomoIv);pomoOn=false;pomoTid=null;pomoEnd=null;}
  document.getElementById('sb-timer').classList.remove('on');
  document.getElementById('st-clock').textContent='00:00:00';
  persist();
}
function tickTrk(){
  if(!trkStart)return;
  const e=Math.floor((Date.now()-trkStart)/1000);
  document.getElementById('st-clock').textContent=hms(e);
  document.querySelectorAll('.live-time[data-lid]').forEach(el=>{
    if(+el.dataset.lid===activeId){const s=tasks.find(x=>x.id===activeId)?.totalTime||0;el.textContent=fmt(s+e);}
  });
}
function startPomo(tid,mins,lbl){
  requestNotifyPermission();
  if(pomoOn&&pomoTid===tid){
    clearInterval(pomoIv);pomoOn=false;stopTracking();render();return;
  }
  pomoOn=true;pomoEnd=Date.now()+mins*60000;pomoTid=tid;
  startTracking(tid);
  clearInterval(pomoIv);
  pomoIv=setInterval(()=>{
    if(activeId!==tid){clearInterval(pomoIv);pomoOn=false;pomoTid=null;pomoEnd=null;render();return;}
    const rem=Math.max(0,Math.ceil((pomoEnd-Date.now())/1000));
    document.querySelectorAll('.pomo-clock').forEach(el=>el.textContent=hms(rem));
    if(rem<=0){
      clearInterval(pomoIv);pomoOn=false;stopTracking(true);
      if(mins===25)triggerPomoAlert('Pomodoro 25min concluído. Iniciando pausa de 5 minutos...',()=>setTimeout(()=>startPomo(tid,5,'Pausa 5m'),300));
      else triggerPomoAlert(`${lbl} concluído!`);
      render();
    }
  },1000);render();
}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;if(h>0)return`${h}h ${String(m).padStart(2,'0')}m`;return`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}
function hms(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}
function live(t){return(activeId===t.id&&trkStart)?Math.floor((Date.now()-trkStart)/1000):0;}

function persist(){save('hw_tasks',tasks);save('hw_notes',notes);save('hw_studies',studies);save('hw_routines',routines);save('hw_cols',columns);save('hw_labels',globalLabels);save('hw_clients',globalClients);save('hw_projects',PROJECTS);save('hw_project_colors',PC);save('hw_types',typeOptions);save('hw_priorities',priorityOptions);render();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad2(n){return String(n).padStart(2,'0');}
function dateFromISO(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1,12,0,0);}
function brTodayISO(){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:APP_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t)?.value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}
function instantToBrISO(v){
  const d=new Date(v);
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:APP_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
  const get=t=>parts.find(p=>p.type===t)?.value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}
function fd(s){if(!s)return'';return dateFromISO(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',timeZone:APP_TZ});}
function toISO(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function addDaysISO(s,n){const d=dateFromISO(s);d.setDate(d.getDate()+n);return toISO(d);}
function weekBounds(offset=0){const d=dateFromISO(todayStr);const day=d.getDay();const mon=new Date(d);mon.setDate(d.getDate()-((day+6)%7)+offset*7);const sun=new Date(mon);sun.setDate(mon.getDate()+6);return{start:toISO(mon),end:toISO(sun)};}
function priorityRank(p){return{critical:0,high:1,med:2,low:3}[p]??4;}
function taskOrderValue(t){
  const raw=t?.listOrder;
  if(raw===undefined||raw===null||raw==='')return null;
  const n=Number(raw);
  return Number.isFinite(n)?n:null;
}
function sortListTasks(a,b){
  const ao=taskOrderValue(a),bo=taskOrderValue(b);
  if(ao!==null||bo!==null){
    if(ao===null)return 1;
    if(bo===null)return -1;
    if(ao!==bo)return ao-bo;
  }
  return (a.date||'').localeCompare(b.date||'')||priorityRank(a.priority)-priorityRank(b.priority)||(a.time||'').localeCompare(b.time||'');
}
function pLabel(p){return(priorityOptions.find(x=>x.id===p)?.name)||p;}
function tLabel(t){return(typeOptions.find(x=>x.id===t)?.name)||t;}
function ptag(p){const o=priorityOptions.find(x=>x.id===p),c=o?.color;return c?`<span class="tag" style="background:${c}22;color:${c};border:1px solid ${c}44">${esc(o.name)}</span>`:`<span class="tag tag-${p}">${esc(pLabel(p))}</span>`}
function ttag(t){return`<span class="tag ${String(t).startsWith('meeting')?'tag-meeting':'tag-task'}">${esc(tLabel(t))}</span>`}
function pjtag(p){if(!p)return'';const c=PC[p]||'#888780';return`<span class="proj-tag" style="background:${c}18;color:${c};border:1px solid ${c}33">${esc(p)}</span>`}
function lblChip(id,small){const lb=globalLabels.find(x=>x.id===id);if(!lb)return'';return`<span class="tag" style="background:${lb.color}22;color:${lb.color};border:1px solid ${lb.color}44;${small?'font-size:10px;padding:1px 5px':''}">${lb.name}</span>`;}

function rList(){
  let html=`<div class="list-top">
    <div class="list-actions">
    <button class="fp${fType==='all'?' on':''}" onclick="setFT('all')">Todas</button>
    ${typeOptions.map(o=>`<button class="fp${fType===o.id?' on':''}" onclick="setFT('${o.id}')">${esc(o.name)}</button>`).join('')}
    <button class="fp${fType==='high'?' on':''}" onclick="setFT('high')">Alta prioridade</button>
    <button class="fp${fType==='no-project'?' on':''}" onclick="setFT('no-project')">Sem projeto</button>
    <div class="fp-sep"></div>
    <button class="fp${showDone?' on':''}" onclick="toggleSD()">&#10003; Concluídas</button>
    <button class="fp${bulkMode?' on':''}" onclick="toggleBulk()">Selecionar</button>
    </div>
    ${advFilterBar()}
  </div>`;
  if(bulkMode||bulkSel.size)html+=bulkBar();
  const wb=weekBounds(0),nwb=weekBounds(1);
  const groups=[
    {id:'overdue',label:'Vencido',always:false,f:t=>t.date&&t.date<todayStr&&t.status!=='done'},
    {id:'today',label:'Hoje',always:true,f:t=>t.date===todayStr&&t.status!=='done'},
    {id:'tomorrow',label:'Amanhã',always:true,f:t=>t.date===tomorrowStr&&t.status!=='done'},
    {id:'next-days',label:'Esta semana',always:true,f:t=>t.date>tomorrowStr&&t.date<=wb.end&&t.status!=='done'},
    {id:'next-week',label:'Próxima semana',always:true,f:t=>t.date>=nwb.start&&t.date<=nwb.end&&t.status!=='done'},
    {id:'no-date',label:'Sem data',always:true,f:t=>!t.date&&t.status!=='done'},
    {id:'done',label:'Concluídas',f:t=>t.status==='done'},
  ];
  let any=false;
  groups.forEach(g=>{
    if(g.label==='Concluídas'&&!showDone)return;
    let ts=tasks.filter(g.f);
    if(fType!=='all'&&typeOptions.some(o=>o.id===fType))ts=ts.filter(t=>t.type===fType);
    else if(fType==='high')ts=ts.filter(t=>t.priority==='high');
    else if(fType==='no-project')ts=ts.filter(t=>!t.project);
    if(fProj!=='all')ts=ts.filter(t=>t.project===fProj);
    ts=ts.filter(matchAdvFilter);

    if(!ts.length&&!g.always)return;any=true;
    html+=`<div class="grp" data-grp="${g.id}"><div class="grp-hdr" data-grp="${g.id}"><span class="grp-lbl">${g.label}</span><div class="grp-line"></div><span class="grp-cnt">${ts.length}</span></div>
      <div class="dz" data-grp="${g.id}">Soltar aqui para mover</div>`;
    ts.sort(sortListTasks);
    ts.forEach(t=>{
      const done=t.status==='done';
      const sd=t.subtasks.filter(s=>s.done).length;
      const isR=activeId===t.id;
      const isOver=t.date&&t.date<todayStr&&t.status!=='done';
      const disp=(t.totalTime||0)+live(t);
      const lc=t.labels.map(id=>lblChip(id,true)).join('');
      html+=`<div class="ti${isR?' trk':''}${done?' done-row':''}${isOver?' overdue':''}" data-id="${t.id}">
        ${bulkMode?`<input type="checkbox" class="bulk-check" ${bulkSel.has(t.id)?'checked':''} onclick="event.stopPropagation();toggleBulkTask(${t.id},this.checked)">`:''}
        <div class="tchk${done?' done':''}" onclick="event.stopPropagation();tglDone(${t.id})">${done?'&#10003;':''}</div>
        <div class="tbody" onclick="openTask(${t.id})">
          <div class="ttitle${done?' done':''}">${esc(t.title)}</div>
          <div class="tmeta">
            ${ttag(t.type)}${ptag(t.priority)}
            ${t.project?pjtag(t.project):''}
            ${t.client?`<span class="tag tag-date">${esc(t.client)}</span>`:''}
            ${isOver?'<span class="tag tag-high">Vencido</span>':''}
            ${t.date?`<button class="tag tag-date editable" onclick="beginInlineDate(event,${t.id})" title="Alterar data">&#128197; ${fd(t.date)}${t.time?' · '+t.time:''}</button>`:''}
            ${t.subtasks.length?`<span style="font-size:11px;color:var(--tx3)">&#128203; ${sd}/${t.subtasks.length}</span>`:''}
            ${disp>0||isR?`<span class="ttime${isR?' run':''}" data-lid="${t.id}" class="live-time">&#128336; ${fmt(disp)}</span>`:''}
            ${lc}
          </div>
        </div>
        <div class="t-btns">
          <input class="order-input" type="text" inputmode="numeric" pattern="[0-9]*" value="${t.listOrder??''}" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()" oninput="setTaskListOrder(${t.id},this)" title="Ordem na lista">
          <button class="act-btn${isR?' play-on':' play-idle'}" onclick="event.stopPropagation();${isR?'stopTracking()':'startTracking('+t.id+')'}" title="${isR?'Pausar cronômetro':'Iniciar cronômetro'}">${isR?'&#9646;&#9646;':'&#9654;'}</button>
          <button class="act-btn drag-handle" draggable="true" data-id="${t.id}" onclick="event.stopPropagation()" title="Arrastar tarefa">&#9776;</button>

        </div>
      </div>`;
    });

  });
  if(!any)html+='<div style="text-align:center;padding:48px;color:var(--tx3);font-size:13px">Nenhuma tarefa encontrada.</div>';
  return html;
}
function setFT(f){fType=f;render();}

function beginInlineDate(e,id){
  e.preventDefault();e.stopPropagation();
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const chip=e.currentTarget;
  const input=document.createElement('input');
  input.type='date';input.value=t.date||'';input.className='inline-date-input';
  input.onclick=ev=>ev.stopPropagation();
  input.onkeydown=ev=>{ev.stopPropagation();if(ev.key==='Escape')render();};
  input.onchange=ev=>{ev.stopPropagation();setInlineDate(id,input.value);};
  input.onblur=()=>setTimeout(()=>{if(document.body.contains(input))render();},120);
  chip.replaceWith(input);
  input.focus();
  if(input.showPicker)input.showPicker();
}
function setInlineDate(id,date){
  const t=tasks.find(x=>x.id===id);if(!t)return;

function setTaskListOrder(id,input){
  input.value=String(input.value||'').replace(/\D/g,'');
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.listOrder=input.value===''?'':Number(input.value);

}
function advFilterBar(){
  return`<div class="adv-filter">
    <span class="adv-filter-lbl">Filtro</span>
    <select onchange="advField=this.value;advValue='all';render()">
      ${[['all','Qualquer campo'],['project','Projeto'],['client','Cliente'],['label','Marcador'],['status','Status'],['type','Tipo'],['priority','Prioridade'],['date','Data']].map(([v,l])=>`<option value="${v}"${advField===v?' selected':''}>${l}</option>`).join('')}
    </select>
    <select onchange="advValue=this.value;render()" ${advField==='all'?'disabled':''}>${advValueOptions()}</select>
    <button class="btn-c" onclick="advField='all';advValue='all';render()">Limpar filtro</button>
  </div>`;
}
function advValueOptions(){
  const opts=[['all','Todos']];
  if(advField==='project')PROJECTS.forEach(p=>opts.push([p,p]));
  if(advField==='client')globalClients.forEach(c=>opts.push([c,c]));
  if(advField==='label')globalLabels.forEach(l=>opts.push([l.id,l.name]));
  if(advField==='status')columns.forEach(c=>opts.push([c.id,c.name]));
  if(advField==='type')typeOptions.forEach(t=>opts.push([t.id,t.name]));
  if(advField==='priority')priorityOptions.forEach(p=>opts.push([p.id,p.name]));
  if(advField==='date')[['overdue','Vencidas'],['today','Hoje'],['tomorrow','Amanhã'],['nodate','Sem data']].forEach(o=>opts.push(o));
  return opts.map(([v,l])=>`<option value="${esc(v)}"${advValue===v?' selected':''}>${esc(l)}</option>`).join('');
}
function matchAdvFilter(t){
  if(advField==='all'||advValue==='all')return true;
  if(advField==='project')return t.project===advValue;
  if(advField==='client')return t.client===advValue;
  if(advField==='label')return(t.labels||[]).includes(advValue);
  if(advField==='status')return t.status===advValue;
  if(advField==='type')return t.type===advValue;
  if(advField==='priority')return t.priority===advValue;
  if(advField==='date')return advValue==='overdue'?(t.date&&t.date<todayStr&&t.status!=='done'):advValue==='today'?t.date===todayStr:advValue==='tomorrow'?t.date===tomorrowStr:advValue==='nodate'?!t.date:true;
  return true;
}
function matchQuickSearch(t){
  const q=(quickSearch||'').trim().toLowerCase();
  return !q||String(t.title||'').toLowerCase().includes(q);
}
function bulkBar(){
  return`<div class="bulk-bar">
    <span class="bulk-count">${bulkSel.size} selecionada(s)</span>
    <button class="btn-c" onclick="selectVisibleTasks()">Selecionar visíveis</button>
    <input type="date" class="bulk-date" id="bulk-date" value="${todayStr}">
    <button class="btn-p" onclick="bulkSetDate()">Aplicar data</button>
    <button class="btn-c" style="color:var(--err-tx)" onclick="bulkDelete()">Excluir selecionadas</button>
    <button class="btn-c" onclick="clearBulk()">Limpar</button>
  </div>`;
}
function toggleBulk(){bulkMode=!bulkMode;if(!bulkMode)bulkSel.clear();render();}
function toggleBulkTask(id,on){if(on)bulkSel.add(id);else bulkSel.delete(id);render();}
function clearBulk(){bulkMode=false;bulkSel.clear();render();}
function visibleListTasks(){
  const wb=weekBounds(0),nwb=weekBounds(1);
  return tasks.filter(t=>{
    if(fType!=='all'&&typeOptions.some(o=>o.id===fType)&&t.type!==fType)return false;
    if(fType==='high'&&t.priority!=='high')return false;
    if(fType==='no-project'&&t.project)return false;
    if(fProj!=='all'&&t.project!==fProj)return false;
    if(!matchAdvFilter(t))return false;
    if(!matchQuickSearch(t))return false;
    if(t.status==='done'&&!showDone)return false;
    if(t.status!=='done'&&t.date>nwb.end)return false;
    return true;
  });
}
function selectVisibleTasks(){bulkMode=true;visibleListTasks().forEach(t=>bulkSel.add(t.id));render();}
function bulkSetDate(){const d=document.getElementById('bulk-date')?.value;if(!d||!bulkSel.size)return;snapshot();tasks.forEach(t=>{if(bulkSel.has(t.id)){t.date=d;if(t.status==='done')t.status='todo';}});clearBulk();persist();}
function bulkDelete(){if(!bulkSel.size)return;if(!confirm(`Excluir ${bulkSel.size} tarefa(s) selecionada(s)?`))return;snapshot();if(activeId!==null&&bulkSel.has(activeId))stopTracking();tasks=tasks.filter(t=>!bulkSel.has(t.id));clearBulk();persist();}
function initLD(){
  document.querySelectorAll('.drag-handle[draggable]').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=+el.dataset.id;el.closest('.ti')?.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragId));document.querySelectorAll('.dz').forEach(z=>z.classList.add('vis'));document.querySelectorAll('.grp').forEach(g=>g.classList.add('drop-ready'));e.stopPropagation();});
    el.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.ti').forEach(el=>el.classList.remove('dragging'));document.querySelectorAll('.dz,.grp,.grp-hdr').forEach(z=>z.classList.remove('vis','hot','drop-ready'));});
  });
  document.querySelectorAll('.dz,.grp,.grp-hdr').forEach(zone=>bindListDrop(zone));
}
function bindListDrop(zone){
  zone.addEventListener('dragenter',e=>{if(!dragId)return;e.preventDefault();zone.classList.add('hot');});
  zone.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();zone.classList.add('hot');});
  zone.addEventListener('dragleave',e=>{if(!zone.contains(e.relatedTarget))zone.classList.remove('hot');});
  zone.addEventListener('drop',e=>{
    if(!dragId)return;
    e.preventDefault();e.stopPropagation();
    const g=zone.dataset.grp||zone.closest('.grp')?.dataset.grp;const t=tasks.find(x=>x.id===dragId);if(!t||!g)return;
    snapshot();moveTaskToListGroup(t,g);
    dragId=null;persist();
  });
}
function moveTaskToListGroup(t,g){
  if(g==='overdue')t.date=addDaysISO(todayStr,-1);
  else if(g==='today')t.date=todayStr;
  else if(g==='tomorrow')t.date=tomorrowStr;
  else if(g==='next-days')t.date=addDaysISO(tomorrowStr,1);
  else if(g==='next-week')t.date=weekBounds(1).start;
  else if(g==='no-date')t.date='';
  else if(g==='done')t.status='done';
  if(g!=='done'&&t.status==='done')t.status='todo';
}

// ── KANBAN ────────────────────────────────────────────────────────────────────
function filteredKanbanTasks(){
  let ts=tasks.slice();
  if(fType!=='all'&&typeOptions.some(o=>o.id===fType))ts=ts.filter(t=>t.type===fType);
  else if(fType==='high')ts=ts.filter(t=>t.priority==='high');
  else if(fType==='no-project')ts=ts.filter(t=>!t.project);
  if(fProj!=='all')ts=ts.filter(t=>t.project===fProj);
  return ts.filter(matchAdvFilter).filter(matchQuickSearch).sort(sortListTasks);
}

function rKanbanCol(col,items,editable){

function colSlug(name){
  const base=String(name||'etapa').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'etapa';
  let id=base,n=2;
  while(columns.some(c=>c.id===id))id=`${base}-${n++}`;
  return id;
}
function addCol(){
  const name=(prompt('Nome da nova etapa:')||'').trim();
  if(!name)return;
  snapshot();
  columns.push({id:colSlug(name),name,color:'#888780'});
  persist();
}
function saveColName(id,name){
  const col=columns.find(c=>c.id===id);if(!col)return;
  const next=(name||'').trim()||col.name;
  if(next===col.name){render();return;}
  snapshot();col.name=next;persist();
}
function delCol(id){
  const col=columns.find(c=>c.id===id);if(!col||columns.length<=1)return;
  const fallback=columns.find(c=>c.id!==id)?.id||'todo';
  if(!confirm(`Excluir a etapa "${col.name}"? As tarefas dela serão movidas para "${columns.find(c=>c.id===fallback)?.name||fallback}".`))return;
  snapshot();
  tasks.forEach(t=>{if(t.status===id)t.status=fallback;});
  columns=columns.filter(c=>c.id!==id);
  persist();
}
function reorderColumn(fromId,toId){
  if(!fromId||!toId||fromId===toId)return;
  const from=columns.findIndex(c=>c.id===fromId),to=columns.findIndex(c=>c.id===toId);
  if(from<0||to<0)return;
  snapshot();
  const [moved]=columns.splice(from,1);
  columns.splice(to,0,moved);
  persist();
}

function saveNote(id){
  const title=(document.getElementById('note-title')?.value||'').trim()||'Sem título';
  const rte=document.getElementById('note-rte');if(rte)normalizeRteLinks(rte);
  const body=rte?rte.innerHTML:'',project=document.getElementById('note-project')?.value||'',client=document.getElementById('note-client')?.value||'';
  snapshot();let n=notes.find(x=>x.id===id);
  if(!n){n={id:Date.now(),created:new Date().toISOString(),order:notes.length};notes.push(n);}
  Object.assign(n,{title,body,project,client,labels:[...(window._noteLabels||[])],updated:new Date().toISOString()});
  curNoteId=n.id;window._noteLabels=[];
  if(!save('hw_notes',notes)){alert('Não foi possível salvar esta anotação. Se ela tiver imagens grandes, o armazenamento local do navegador pode ter atingido o limite.');return;}
  document.getElementById('modal').innerHTML='';render();
}
function deleteNote(id){if(!confirm('Excluir esta anotação?'))return;snapshot();notes=notes.filter(n=>n.id!==id);if(curNoteId===id)curNoteId=orderedNotes()[0]?.id||null;save('hw_notes',notes);render();}

function studySideItem(c){

function studyDoc(c){
  const lessons=c.lessons||[],done=lessons.filter(l=>l.status==='done').length,planned=lessons.filter(l=>l.date&&l.status!=='done').length,next=lessons.filter(l=>l.date&&l.status!=='done').sort((a,b)=>a.date.localeCompare(b.date))[0];

    <div class="study-kpi"><span>Concluídas</span><strong>${done}</strong></div>
    <div class="study-kpi"><span>Planejadas</span><strong>${planned}</strong></div>

  <div class="bulk-bar" style="box-shadow:none;margin-bottom:14px"><span class="adv-filter-lbl">Módulo</span><select onchange="studyModuleFilter=this.value;render()" style="min-width:260px">${studyModuleOptions(c)}</select><button class="btn-c" onclick="studyModuleFilter='all';render()">Todos</button><span class="bulk-count">${filtered.length} aula(s)</span></div>

function orderedLessons(c){return[...(c.lessons||[])].sort((a,b)=>(a.status==='done')-(b.status==='done')||(a.date||'9999-12-31').localeCompare(b.date||'9999-12-31')||(a.title||'').localeCompare(b.title||''));}
function studyModuleOptions(c){
  const mods=[...new Set((c.lessons||[]).map(l=>(l.module||'').trim()))].sort((a,b)=>(a||'~').localeCompare(b||'~'));
  const exists=studyModuleFilter==='all'||mods.includes(studyModuleFilter)||(studyModuleFilter==='__blank'&&mods.includes(''));
  if(!exists)studyModuleFilter='all';
  return`<option value="all"${studyModuleFilter==='all'?' selected':''}>Todos os módulos</option>`+mods.map(m=>`<option value="${m?esc(m):'__blank'}"${(m&&studyModuleFilter===m)||(!m&&studyModuleFilter==='__blank')?' selected':''}>${m?esc(m):'Sem módulo'}</option>`).join('');
}
function filterStudyLessons(c){
  let list=orderedLessons(c);
  if(studyModuleFilter==='all')return list;
  if(studyModuleFilter==='__blank')return list.filter(l=>!l.module);
  return list.filter(l=>l.module===studyModuleFilter);
}
function lessonRow(c,l){
  return`<div class="lesson-row${l.status==='done'?' done':''}">
    <input class="lesson-check" type="checkbox" ${l.status==='done'?'checked':''} onchange="toggleLessonDone(${c.id},${l.id},this.checked)">
    <div class="lesson-main"><div class="lesson-title">${esc(l.title||'Aula sem título')}</div><div class="tmeta">${l.module?`<span class="tag tag-date">${esc(l.module)}</span>`:''}${l.date?`<span class="tag tag-date">&#128197; ${fd(l.date)}</span>`:''}${l.status==='progress'?'<span class="tag tag-med">Em andamento</span>':l.status==='done'?'<span class="tag tag-low">Concluída</span>':'<span class="tag tag-date">Não iniciada</span>'}${l.link?'<span class="tag tag-date">Link</span>':''}</div>${l.notes?`<div class="lesson-notes">${esc(stripHTML(l.notes))}</div>`:''}</div>
    <div class="lesson-actions">${l.link?`<a class="btn-c" href="${esc(l.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Abrir</a>`:''}<button class="btn-c" onclick="openLessonEditor(${c.id},${l.id})">Editar</button><button class="btn-c" onclick="lessonToTask(${c.id},${l.id})">Criar tarefa</button><button class="btn-c" style="color:var(--err-tx)" onclick="deleteLesson(${c.id},${l.id})">Excluir</button></div>

function linkifyText(txt){return esc(txt).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`).replace(/\n/g,'<br>');}

function saveStudy(id){
  const course=(document.getElementById('study-course')?.value||'').trim()||'Curso sem nome';

  if(!c){c={id:Date.now(),lessons:[],created:new Date().toISOString()};studies.push(c);}
  Object.assign(c,{course,project:document.getElementById('study-project')?.value||'',priority:document.getElementById('study-priority')?.value||'med',notes:document.getElementById('study-notes')?.value||'',updated:new Date().toISOString()});

}
function deleteStudy(id){if(!confirm('Excluir este curso e todas as aulas dele?'))return;snapshot();studies=studies.filter(c=>c.id!==id);curStudyId=studies[0]?.id||null;persist();}

function saveLesson(courseId,lessonId){
  const c=studies.find(x=>x.id===courseId);if(!c)return;const title=(document.getElementById('lesson-title')?.value||'').trim()||'Aula sem título';
  snapshot();let l=(c.lessons||[]).find(x=>x.id===lessonId);if(!l){l={id:Date.now(),created:new Date().toISOString()};c.lessons=c.lessons||[];c.lessons.push(l);}
  Object.assign(l,{title,module:(document.getElementById('lesson-module')?.value||'').trim(),date:document.getElementById('lesson-date')?.value||'',status:document.getElementById('lesson-status')?.value||'todo',link:(document.getElementById('lesson-link')?.value||'').trim(),notes:document.getElementById('lesson-notes')?.value||'',updated:new Date().toISOString()});
  curStudyId=courseId;persist();closeModalNoSave();

function toggleLessonDone(courseId,lessonId,on){const c=studies.find(x=>x.id===courseId),l=c?.lessons?.find(x=>x.id===lessonId);if(!l)return;snapshot();l.status=on?'done':'todo';l.doneAt=on?new Date().toISOString():'';persist();}
function deleteLesson(courseId,lessonId){if(!confirm('Excluir esta aula?'))return;const c=studies.find(x=>x.id===courseId);if(!c)return;snapshot();c.lessons=(c.lessons||[]).filter(l=>l.id!==lessonId);persist();}
function lessonToTask(courseId,lessonId){
  const c=studies.find(x=>x.id===courseId),l=c?.lessons?.find(x=>x.id===lessonId);if(!c||!l)return;
  snapshot();
  tasks.push({id:nextId++,title:'Estudar: '+(l.title||c.course),type:'task',status:'todo',priority:c.priority||'med',date:l.date||'',time:'',details:`<p><strong>${esc(c.course||'Curso')}</strong></p>${l.module?`<p>Módulo: ${esc(l.module)}</p>`:''}${l.link?`<p><a href="${esc(l.link)}" target="_blank" rel="noopener">${esc(l.link)}</a></p>`:''}${l.notes?`<p>${esc(l.notes).replace(/\n/g,'<br>')}</p>`:''}`,subtasks:[],totalTime:0,sessions:[],project:c.project||'',client:'',labels:[],history:[]});
  l.taskId=nextId-1;persist();showToast('Tarefa criada a partir da aula');
}

// ── CALENDAR ──────────────────────────────────────────────────────────────────
function rCal(){
  const mN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const dN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const fd_=new Date(calYear,calMonth,1).getDay(),dim=new Date(calYear,calMonth+1,0).getDate(),dip=new Date(calYear,calMonth,0).getDate();
  let html=`<div class="cal-hdr"><div style="display:flex;gap:3px">
    <button class="ib" style="width:30px;height:30px" onclick="calPrev()">&#8249;</button>
    <button class="ib" style="width:30px;height:30px" onclick="calNext()">&#8250;</button>
  </div><span class="cal-mo">${mN[calMonth]} ${calYear}</span>
  <button class="fp on" style="font-size:12px" onclick="calToday()">Hoje</button></div>
  <div class="cal-legend"><span class="tag" style="background:#B91C1C22;color:#B91C1C;border:1px solid #B91C1C44">Reunião comercial</span><span class="tag" style="background:#0F766E22;color:#0F766E;border:1px solid #0F766E44">Reunião operacional</span><span class="tag" style="background:${PC.Pessoal||'#14532D'}22;color:${PC.Pessoal||'#14532D'};border:1px solid ${PC.Pessoal||'#14532D'}44">Pessoal</span></div>
  <div class="cal-grid"><div class="cal-days">${dN.map(d=>`<div class="cal-dl">${d}</div>`).join('')}</div><div class="cal-cells">`;
  let cells=[];
  for(let i=fd_-1;i>=0;i--)cells.push({day:dip-i,cur:false});
  for(let d=1;d<=dim;d++)cells.push({day:d,cur:true});
  while(cells.length%7!==0)cells.push({day:cells.length-fd_-dim+1,cur:false});
  cells.forEach(cell=>{
    const ds=cell.cur?`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(cell.day).padStart(2,'0')}`:'';
    const isT=ds===todayStr;
    let dt=ds?tasks.filter(t=>t.date===ds):[];
    if(fProj!=='all')dt=dt.filter(t=>t.project===fProj);
    if(fType!=='all'&&typeOptions.some(o=>o.id===fType))dt=dt.filter(t=>t.type===fType);
    dt=dt.filter(matchQuickSearch);
    html+=`<div class="cal-cell${isT?' today':''}${!cell.cur?' other':''}" data-date="${ds}" onclick="${cell.cur?`openNew('${ds}')`:''}" >
      <div class="cal-dn">${cell.day}</div>
      ${dt.sort((a,b)=>priorityRank(a.priority)-priorityRank(b.priority)||(a.time||'99:99').localeCompare(b.time||'99:99')||a.title.localeCompare(b.title)).slice(0,3).map(t=>calEventHtml(t)).join('')}
      ${dt.length>3?`<button class="cal-more" onclick="event.stopPropagation();openDayTasks('${ds}')">+${dt.length-3} ver todas</button>`:''}
    </div>`;
  });
  return html+'</div></div>';
}
function calEventHtml(t){
  const cls=(t.time?' has-time':' no-time')+(t.type==='meeting-commercial'?' meet-commercial':t.type==='meeting-operational'?' meet-operational':t.project==='Pessoal'?' personal-ev':t.type==='meeting'?' meet':t.priority==='high'?' urg':' task-ev');
  const color=t.type==='meeting-commercial'?'#B91C1C':t.type==='meeting-operational'?'#0F766E':(PC[t.project]||'');
  const style=color?` style="background:${color}22;color:${color};border-color:${color}44"`:'';
  const icon=t.type==='meeting-commercial'?'&#128188; ':t.type==='meeting-operational'?'&#129309; ':t.project==='Pessoal'?'&#9679; ':t.type==='meeting'?'&#128197; ':'';
  return`<div class="cal-ev${cls}"${style} draggable="true" data-id="${t.id}" onclick="event.stopPropagation();openTask(${t.id})">${icon}${t.time?`<span class="cal-event-time">${esc(t.time)}</span>`:''}${esc(t.title)}</div>`;
}
function initCalD(){
  document.querySelectorAll('.cal-ev[draggable]').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragId=+el.dataset.id;e.stopPropagation();});
    el.addEventListener('dragend',()=>document.querySelectorAll('.cal-cell').forEach(c=>c.classList.remove('drag-on')));
  });
  document.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    const date=cell.dataset.date;if(!date)return;
    cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('drag-on');});
    cell.addEventListener('dragleave',e=>{if(!cell.contains(e.relatedTarget))cell.classList.remove('drag-on');});
    cell.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();cell.classList.remove('drag-on');if(!dragId)return;snapshot();const t=tasks.find(x=>x.id===dragId);if(t&&date)t.date=date;dragId=null;persist();});
  });
}
function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}render();}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}render();}
function calToday(){calMonth=todayCal.getMonth();calYear=todayCal.getFullYear();render();}
function openDayTasks(date){
  let dayTasks=tasks.filter(t=>t.date===date);
  if(fProj!=='all')dayTasks=dayTasks.filter(t=>t.project===fProj);
  dayTasks=dayTasks.filter(matchQuickSearch);
  dayTasks.sort((a,b)=>priorityRank(a.priority)-priorityRank(b.priority)||(a.time||'99:99').localeCompare(b.time||'99:99')||a.title.localeCompare(b.title));
  document.getElementById('modal').innerHTML=`<div class="mbk" onclick="closeMB(event)"><div class="mo" onclick="event.stopPropagation()" style="max-width:560px">
    <div class="mo-main">
      <div class="mo-hdr"><span class="mo-title">Tarefas de ${fd(date)}</span><button class="ib" style="margin-left:auto" onclick="closeModalNoSave()">&#10005;</button></div>
      <div class="mo-body">${dayTasks.map(t=>`<div class="ti" style="cursor:pointer" onclick="openTask(${t.id})"><div class="tbody"><div class="ttitle">${esc(t.title)}</div><div class="tmeta">${ptag(t.priority)}${t.project?pjtag(t.project):''}${t.time?`<span class="tag tag-date">&#128336; ${t.time}</span>`:''}</div></div></div>`).join('')||'<div class="no-data">Sem tarefas</div>'}</div>
    </div>
  </div></div>`;
}

function setCustomPer(){window.dashStart=document.getElementById('dash-start')?.value||weekBounds(0).start;window.dashEnd=document.getElementById('dash-end')?.value||todayStr;dashPer='custom';render();}
function periodRange(){
  const now=todayCal,wb=weekBounds(0);
  if(dashPer==='today')return{start:todayStr,end:todayStr,label:'hoje'};
  if(dashPer==='week')return{start:wb.start,end:wb.end,label:'semana atual'};
  if(dashPer==='month')return{start:toISO(new Date(now.getFullYear(),now.getMonth(),1,12)),end:toISO(new Date(now.getFullYear(),now.getMonth()+1,0,12)),label:'mês atual'};
  if(dashPer==='custom')return{start:window.dashStart||wb.start,end:window.dashEnd||todayStr,label:'período selecionado'};
  return{start:'0000-01-01',end:'9999-12-31',label:'todo período'};
}
function getSess(){
  const r=periodRange();let res=[];
  tasks.forEach(t=>{
    (t.sessions||[]).forEach(s=>{const ds=instantToBrISO(s.start);if(ds>=r.start&&ds<=r.end)res.push({...s,tid:t.id,ttitle:t.title,type:t.type,prio:t.priority,proj:t.project||''});});

function getSessForRange(start,end){
  return getSessListForRange(start,end).reduce((a,s)=>a+s.dur,0);
}
function getSessListForRange(start,end){
  let res=[];
  tasks.forEach(t=>(t.sessions||[]).forEach(s=>{const ds=instantToBrISO(s.start);if(ds>=start&&ds<=end)res.push({...s,tid:t.id,ttitle:t.title,type:t.type,prio:t.priority,proj:t.project||''});}));
  if(activeId!==null&&trkStart){const t=tasks.find(x=>x.id===activeId),ds=instantToBrISO(trkStart);if(t&&ds>=start&&ds<=end)res.push({start:new Date(trkStart).toISOString(),end:null,dur:Math.floor((Date.now()-trkStart)/1000),tid:t.id,ttitle:t.title,type:t.type,prio:t.priority,proj:t.project||'',live:true});}

}

function ddToggle(id){

function ddRenderList(id,q){

function ddFilter(id,q){ddRenderList(id,q);}
function ddToggleItem(id,v){

  ddRefreshTrigger(id);ddRenderList(id,'');

function ddRemove(id,v){
  if(id==='labels'){window._editLabels=(window._editLabels||[]).filter(x=>x!==v);}
  if(id==='note-labels'){window._noteLabels=(window._noteLabels||[]).filter(x=>x!==v);}

}
function ddRefreshTrigger(id){
  const isLabel=id==='labels'||id==='note-labels';const isClient=id==='client';
  const trig=document.getElementById('ddt-'+id);if(!trig)return;

  const chips=sel.map(v=>{const item=all.find(x=>x.id===v||x===v);const label=item?(item.name||item):'?';const color=item&&item.color?item.color:'#888';return`<span class="dd-chip" style="background:${color}22;color:${color};border:1px solid ${color}44">${label}<span class="dd-chip-x" onmousedown="event.stopPropagation();ddRemove('${id}','${v}')">&#10005;</span></span>`;}).join('');

function ddAdd(id){
  const inp=document.getElementById('ddi-'+id);if(!inp)return;

  }

}
